/* 命中类型折叠：默认 Top3，超出 +N，悬浮气泡展示全部 */
.qc-page .prob-tags .prob-more { position: relative; cursor: default; color: var(--text-3); }
.qc-page .prob-tags .prob-more:hover { color: var(--primary); }
.qc-page .prob-bubble {
  display: none;
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 70;
  flex-wrap: wrap;
  gap: 4px;
  width: max-content;
  max-width: 260px;
  padding: 8px;
  background: #fff;
  border: 1px solid #e8ebf1;
  border-radius: 10px;
  box-shadow: 0 10px 30px rgba(26, 34, 56, 0.12);
}
.qc-page .prob-tags .prob-more:hover .prob-bubble { display: flex; }

/* 系列详情抽屉加宽（平台矩阵列较多） */
.qc-center-page .drawer.qc-series-drawer { width: 960px; }

/* ---------- 问题诊断与优化建议 ---------- */
.qc-page .prob-item {
  border: 1px solid #e8ebf1;
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 10px;
  background: var(--white);
}
.qc-page .prob-head { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.qc-page .prob-type { font-weight: 600; font-size: var(--fs-base); }
.qc-page .prob-cnt { color: var(--text-3); }

.qc-page .sugg-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--primary-light-2);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 12px;
  color: var(--text-2);
  margin-top: 6px;
}
.qc-page .sugg-chip a { margin-left: auto; color: var(--primary); cursor: pointer; white-space: nowrap; }
.qc-page .sugg-chip a:hover { opacity: .8; }

/* ---------- 优化任务 ---------- */
.qc-page .task-head { display: flex; align-items: center; margin-bottom: 12px; }
.qc-page .task-head .btn { margin-left: auto; }
.qc-page .task-summary { color: var(--text-3); font-size: 12px; }

.qc-page .rel-task {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  padding: 8px 10px;
  border: 1px solid #e8ebf1;
  border-radius: 6px;
  margin-bottom: 6px;
  background: var(--white);
}
.qc-page .rel-task .op-a { margin-left: auto; color: var(--primary); cursor: pointer; white-space: nowrap; }

/* ---------- 表单（建任务 / 审核） ---------- */
.qc-page .qc-form .f-row { margin-bottom: 14px; }
.qc-page .qc-form .f-row.two { display: flex; gap: 12px; }
.qc-page .qc-form .f-row.two > div { flex: 1; }
.qc-page .qc-form .f-label { font-size: 12px; color: var(--text-3); margin-bottom: 6px; }
.qc-page .qc-form .input { width: 100%; }
.qc-page .qc-form select.input:disabled { background: var(--fill-1); color: var(--text-3); cursor: not-allowed; }

/* ---------- 规则配置：阈值配置 / 问题类型管理 ---------- */
.qc-page .th-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 1300px) {
  .qc-page .th-grid { grid-template-columns: 1fr; }
}
.qc-page .th-input { display: flex; align-items: center; gap: 8px; margin: 10px 0 8px; }
.qc-page .th-input .input { width: 140px; }
.qc-page .th-input .unit { color: #8b92a1; font-size: var(--fs-base); }
.qc-page .th-hit { font-size: 12px; color: #8b92a1; line-height: 1.7; }
.qc-page .th-hit b { color: #f53f3f; font-size: 14px; }
.qc-page .th-actions { display: flex; align-items: center; gap: 10px; }
.qc-page .th-note { font-size: 12px; color: #8b92a1; }
.qc-page .th-rules { display: flex; flex-direction: column; gap: 8px; }
.qc-page .th-rule { font-size: 12px; color: #5b6475; line-height: 1.7; }
.qc-page .th-rule b { color: #202532; margin-right: 10px; }
.qc-page .type-add-row { display: flex; gap: 10px; margin: 10px 0 4px; }
.qc-page .type-add-row .input { width: 280px; }

/* ---------- 会话/售后单信息增强 ---------- */
.qc-page .cell-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.qc-page .s-shop, .qc-page .s-order { font-size: 12px; color: #8b92a1; }
.qc-page .b-toggle { margin-bottom: 8px; }
.qc-page .b-toggle a { font-size: 12px; color: var(--primary); cursor: pointer; }
.qc-page .b-toggle a:hover { opacity: .8; }
/* 长会话内部滚动，避免擑爆页面 */
.qc-page .b-list { max-height: 340px; overflow-y: auto; padding-right: 4px; }

/* 聊天记录核查：商品编码展开后的会话卡片列表 */
.qc-page .chat-code-sessions { display: flex; flex-direction: column; gap: 10px; }
/* =========================================================
   聚合接待（宝妈接待）专属样式（基于 .qc-page 品控视觉语言扩展）
   主色 #4f7cff / 16px 圆角白卡 / 13px 表格字号，与品控中心一致
   ========================================================= */

.rc-page input[type='checkbox'],
.rc-page input[type='radio'] { accent-color: var(--primary); }

.rc-view { flex: 1; display: flex; flex-direction: column; gap: 12px; min-height: 0; }

/* ---------- 内容区主 tab：绩效指标 / 实时数据（下划线式页级 tab） ---------- */
.rc-main-tabs { display: flex; align-items: center; gap: 24px; flex: none; padding: 0 2px; }
.rc-main-tabs button {
  position: relative;
  border: none;
  background: transparent;
  font-family: inherit;
  padding: 4px 2px 8px;
  font-size: var(--fs-md);
  color: var(--color-text-2);
  cursor: pointer;
  transition: color 0.15s;
}
.rc-main-tabs button:hover { color: var(--primary); }
.rc-main-tabs button.active { color: var(--primary); font-weight: 600; }
.rc-main-tabs button.active::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 2px;
  border-radius: 1px;
  background: var(--primary);
}

/* ---------- 顶部窗口 tab 栏（6 窗口，当前页不可关闭） ---------- */
.rc-wtabs {
  display: flex;
  align-items: flex-end;
  gap: 4px;
  padding: 8px 16px 0;
  background: #fff;
  border-bottom: 1px solid var(--color-border);
}
.rc-wtab {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 38px;
  padding: 0 14px;
  font-size: var(--fs-base);
  color: var(--text-2);
  border: 1px solid transparent;
  border-bottom: none;
  border-radius: var(--radius-md) var(--radius-md) 0 0;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  transition: color 0.15s, background 0.15s;
}
.rc-wtab:hover { color: var(--primary); background: var(--color-primary-light-2); }
.rc-wtab.active {
  margin-bottom: -1px;
  padding-bottom: 1px;
  color: var(--primary);
  font-weight: 500;
  background: var(--color-bg);
  border-color: var(--color-border);
}
.rc-wtab .x {
  display: flex;
  align-items: center;
  padding: 2px;
  color: var(--color-text-4);
  border-radius: var(--radius-xs);
  transition: color 0.15s, background 0.15s;
}
.rc-wtab .x:hover { color: var(--text-2); background: var(--color-fill-2); }
.rc-wtab.active .x { color: var(--color-text-3); }

/* ---------- 左侧菜单（qc-side 基础上扩展树形菜单） ---------- */
.rc-side .rc-side-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 2px 10px 12px;
  font-size: 16px;
}
.rc-side .rc-side-brand b { font-weight: 700; color: #202532; }
.rc-logo {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--color-primary-hover), var(--color-primary));
  color: #fff;
  font-size: var(--fs-base);
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.rc-menu { display: flex; flex-direction: column; gap: 2px; }
.rc-menu-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: var(--fs-base);
  color: #445066;
  cursor: pointer;
  user-select: none;
}
.rc-menu-item:hover { background: #f5f8ff; }
.rc-menu-item.child { padding-left: 34px; font-size: 12.5px; position: relative; }
.rc-menu-item.child.active { background: var(--primary-light); color: var(--primary); font-weight: 700; }
.rc-menu-item.child.active::after {
  content: '';
  position: absolute;
  right: 0;
  top: 6px;
  bottom: 6px;
  width: 3px;
  border-radius: 2px;
  background: var(--primary);
}
.rc-menu-ico { width: 16px; flex: 0 0 16px; text-align: center; color: #8b92a1; font-size: 12px; }
.rc-menu-text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-menu-arrow { color: #9aa1ae; font-size: 11px; transition: transform 0.15s; }
.rc-menu-arrow:not(.open) { transform: rotate(-90deg); }

/* ---------- 筛选行 ---------- */
/* 筛选行：气泡下拉为块级元素，需显式横向排布（原生 select 内联自然成行的等价布局） */
.rc-filter-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rc-filter-row .rc-bs { width: 148px; flex: none; }
/* 查询区独立白卡：与列表卡以灰色间隙分隔；高度贴合内容，不参与剩余高度拉伸（拉伸只归列表卡） */
.rc-filter-card .qc-filters { margin: 0; }
.rc-page .rc-filter-card { flex: none; }

/* ---------- 实时数据 tab：筛选卡操作区 / 统计 chip / 指标色点筛选 ---------- */
.rc-rt-view { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
/* 查询/刷新按钮：与筛选条件同排右对齐，归到查询卡内 */
.rc-rt-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
/* 按钮与同排 40px 筛选控件等高（压过 .qc-page .btn 的38px） */
.rc-page .rc-rt-actions .btn { height: 40px; }
/* 列表卡头部条：统计 chip 左，最近更新时间右 */
.rc-rt-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.rc-rt-chips { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rc-rt-bar .rc-rt-time { margin-left: auto; }
.rc-rt-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 12px;
  background: #fff;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  font-size: var(--fs-aux);
  color: var(--color-text-2);
  white-space: nowrap;
}
.rc-rt-chip b { font-size: var(--fs-base); color: var(--color-text); font-variant-numeric: tabular-nums; }
.rc-rt-chip b.g { color: var(--color-success); }
.rc-rt-chip b.w { color: var(--color-warning); }
.rc-rt-chip b.r { color: var(--color-danger); }
.rc-rt-time { font-size: var(--fs-aux); color: var(--color-text-3); white-space: nowrap; }
/* 指标单元格：字体统一黑 600；不铺浅底、排名标签统一灰（.tag 中性），评判等级口径仅在列头漏斗筛选 */
.rc-rt-val { color: var(--color-text); font-weight: 600; }
/* 排名标签：统一灰色（.tag 中性底色 fill-2 + text-2）；定宽+居中保证同列标签等长、指标值左缘成一条线；与值间距 12px
   选择器带 .rc-rt-val 提权：覆盖 .pm-page .tag 基类的 margin: 2px */
.rc-rt-val .tag.rc-rt-rank { width: 54px; justify-content: center; margin: 0 12px 0 0; }
/* 评判等级图例点（列头筛选菜单选项内）：静态展示，不可点击 */
.rc-rt-dot {
  display: inline-block; /* i 标签默认 inline，不写则宽高不生效 */
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: currentColor;
  vertical-align: 0;
  margin-right: 2px;
}
.rc-rt-dot.g { color: var(--color-success); }
.rc-rt-dot.y { color: var(--color-warning); }
.rc-rt-dot.r { color: var(--color-danger); }
.rc-rt-table { min-width: 960px; }
.rc-rt-foot { justify-content: space-between; }
.rc-rt-foot .rc-pager { margin: 0; }
.rc-rt-total { font-size: 12.5px; color: #445066; }

/* 分组维度切换标签（参考品控中心系列展开行内嵌 tab 样式） */
.rc-page .qc-range-toggle { display: flex; gap: 8px; }
.rc-page .qc-range-toggle button {
  border: none;
  background: #f2f3f5;
  color: #445066;
  font-size: 12px;
  padding: 6px 14px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
}
.rc-page .qc-range-toggle button:hover { background: #e8ebf1; }
.rc-page .qc-range-toggle button.active {
  background: #fff;
  color: var(--primary);
  font-weight: 500;
  box-shadow: 0 1px 4px rgba(26, 34, 56, 0.1);
}
.rc-group-tabs { margin-bottom: 12px; }

/* 展开区头部：分组标签 + 右侧分组策略总开关 */
.rc-expand-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
.rc-expand-head .rc-group-tabs { margin-bottom: 0; }
.rc-group-strategy {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  color: #5b6475;
  flex: none;
}
.rc-rel-link {
  color: var(--primary);
  cursor: pointer;
}
.rc-rel-link:hover { text-decoration: underline; }
/* 操作列竖排：手动分流 / 关联策略 */
.rc-ops {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
}
/* 「更多」触发链接与操作链接同色同交互 */
.rc-ops a { color: var(--primary); text-decoration: none; }
.rc-ops a:hover { text-decoration: underline; }
.rc-switch.disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

/* 展开区白色子表（复用 .matrix，尺寸向图二看齐） */
.rc-page .matrix.rc-sub th,
.rc-page .matrix.rc-sub td { padding: 16px 12px; white-space: nowrap; }
.rc-page .matrix.rc-sub th.check,
.rc-page .matrix.rc-sub td.check { width: 40px; text-align: center; }
.rc-page .matrix.rc-sub tr.rc-row-group td { background: #f7f8fa; }
.rc-page .matrix.rc-sub td a { color: var(--primary); cursor: pointer; }
.rc-page .matrix.rc-sub td a:hover { text-decoration: underline; }
.rc-sub-empty { text-align: center; color: #8b92a1; }
.pm-page.rc-page .rc-input { width: 176px; flex: none; }
.pm-page.rc-page .rc-input.wide { width: auto; flex: 1; }
.rc-actions { margin-left: auto; display: flex; gap: 8px; }

/* ---------- 树形表格 ---------- */
.rc-wide { overflow-x: auto; }
.rc-tree { min-width: 1560px; }
.rc-tree td { white-space: nowrap; }
.rc-tree thead th.center { text-align: center; }
.rc-tree th.check,
.rc-tree td.check { width: 42px; text-align: center; }
.rc-tree td a { color: var(--primary); cursor: pointer; }
.rc-tree td a:hover { text-decoration: underline; }
.rc-caret {
  display: inline-block;
  margin-right: 6px;
  color: #8b92a1;
  cursor: pointer;
  transition: transform 0.15s;
  font-size: 12px;
}
.rc-caret:not(.open) { transform: rotate(-90deg); }
.rc-row-company td { background: #fff; }
/* 公司父行行高向子表成员行看齐，避免外矮内高 */
.rc-page .rc-tree tbody tr.rc-row-company > td { padding: 18px 12px; }
/* 父行 caret 与勾选同列（图二树形缩进）：首列加宽，名称列自然缩进 */
.rc-page .rc-tree th.check,
.rc-page .rc-tree td.check { width: 56px; }
.rc-row-company td.check .rc-caret { margin-right: 10px; margin-left: 4px; }
.rc-row-group td { background: #f7f8fa; }
.rc-row-agent:hover td { background: #f5f9ff; }
/* 接待数据单元格：人工/AI 等宽标签 + 数值对齐 */
.rc-duo { display: flex; align-items: center; gap: 8px; white-space: nowrap; line-height: 1.6; }
.rc-duo + .rc-duo { margin-top: 6px; }
.rc-duo .rc-tagw { flex: none; width: 40px; justify-content: center; margin: 0; }
.rc-duo .tag { display: inline-flex; align-items: center; font-size: 11.5px; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
.rc-duo .tag.green { background: var(--color-success-light); color: var(--color-success); }
.rc-duo .tag.orange { background: var(--color-warning-light); color: var(--color-warning); }
.rc-group-name { padding-left: 30px; }
/* 接待状态：彩色圆点 + 文本 */
.rc-st { display: inline-flex; align-items: center; gap: 6px; color: #445066; }
.rc-st::before { content: ''; width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.rc-st.on::before { background: var(--color-success); }
.rc-st.rest::before { background: var(--color-warning); }
.rc-st.off::before { background: #b0b6c3; }

/* 子表列头筛选（接待状态） */
.rc-th-st { position: relative; }
/* SortTh 插槽内漏斗+菜单锚点：菜单相对它定位，整体 @click.stop 防触发列排序 */
.rc-col-anchor { position: relative; display: inline-flex; align-items: center; }
.rc-col-filter { display: inline-flex; vertical-align: -1px; margin-left: 4px; color: #9aa1ae; cursor: pointer; }
.rc-col-filter:hover { color: var(--primary); }
.rc-col-filter.on { color: var(--primary); }
.rc-col-mask { position: fixed; inset: 0; z-index: 40; }
.rc-col-menu {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  z-index: 41;
  min-width: 88px;
  background: #fff;
  border: 1px solid #e5e9f0;
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(26, 34, 56, 0.12);
  padding: 4px;
}
.rc-col-opt { padding: 6px 10px; font-size: 12px; font-weight: 400; color: #445066; border-radius: 6px; cursor: pointer; white-space: nowrap; text-align: left; }
.rc-col-opt:hover { background: #f5f8ff; color: var(--primary); }
.rc-col-opt.cur { background: #f0f5ff; color: var(--primary); font-weight: 600; }

/* 展开区头部右侧：分组策略开关 + 值班监控入口 */
.rc-head-right { display: flex; align-items: center; gap: 12px; flex: none; }

/* 值班监控抽屉：左时长指标 + 右 24h 时间线（分组=多人块堆叠，随抽屉体滚动） */
.rc-duty-list { display: flex; flex-direction: column; gap: 16px; }
.rc-duty-person { display: flex; flex-direction: column; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--color-border-2); }
.rc-duty-person:last-child { padding-bottom: 0; border-bottom: none; }
.rc-duty-person-hd {
  display: flex;
  align-items: center;
  padding-left: 8px;
  border-left: 3px solid var(--primary);
  font-size: var(--fs-md);
  font-weight: 500;
  color: var(--color-text);
}
.rc-duty { display: grid; grid-template-columns: 200px 1fr; gap: 20px; }
.rc-duty-stats { display: flex; flex-direction: column; gap: 10px; }
.rc-duty-stat { display: flex; align-items: center; gap: 8px; font-size: var(--fs-base); }
.rc-duty-stat i { flex: none; width: 9px; height: 9px; border-radius: 50%; }
.rc-duty-stat .k { flex: 1; color: var(--color-text-2); }
.rc-duty-stat b { color: var(--color-text); font-variant-numeric: tabular-nums; }
.rc-duty-tl { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.rc-duty-lane { display: flex; flex-direction: column; gap: 6px; }
.rc-duty-tl-head { display: flex; align-items: center; justify-content: space-between; font-size: var(--fs-aux); }
.rc-duty-tl-head .t { font-weight: 600; color: var(--color-text-2); }
.rc-duty-legend span { margin-left: 12px; color: var(--color-text-3); }
.rc-duty-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
.rc-duty-legend i.on { background: var(--color-success); }
.rc-duty-legend i.off { background: var(--color-text-4); }
.rc-duty-legend i.rest { background: var(--color-warning); }
.rc-duty-bar { position: relative; height: 14px; border-radius: 7px; background: var(--color-text-4); overflow: hidden; }
.rc-duty-seg { position: absolute; top: 0; height: 100%; }
.rc-duty-seg.on { background: var(--color-success); }
.rc-duty-seg.rest { background: var(--color-warning); }
.rc-duty-seg.off { background: var(--color-text-4); }
.rc-duty-axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--color-text-3); }

/* 值班监控抽屉：右侧滑入全高面板（遮罩点击 / Esc / 关闭按钮均可关） */
.rc-mon-mask { position: fixed; inset: 0; z-index: 2600; background: rgba(26, 34, 56, 0.45); }
.rc-mon-drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  z-index: 2601;
  width: min(920px, 92vw);
  display: flex;
  flex-direction: column;
  background: #fff;
  box-shadow: -12px 0 40px rgba(0, 0, 0, 0.25);
  animation: rc-mon-in 0.22s ease;
}
@keyframes rc-mon-in {
  from { transform: translateX(100%); }
  to { transform: translateX(0); }
}
.rc-mon-head {
  flex: none;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 16px 24px;
  border-bottom: 1px solid var(--color-border-2);
}
.rc-mon-head b { font-size: 15px; font-weight: 600; color: var(--color-text); }
.rc-mon-sub { display: block; margin-top: 4px; font-size: var(--fs-aux); color: var(--color-text-3); }
.rc-mon-x {
  flex: none;
  border: none;
  background: none;
  padding: 4px;
  font-size: 14px;
  line-height: 1;
  color: var(--color-text-3);
  cursor: pointer;
}
.rc-mon-x:hover { color: var(--color-text); }
.rc-mon-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 16px 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  scrollbar-width: thin;
}
.rc-mon-foot {
  flex: none;
  display: flex;
  justify-content: flex-end;
  padding: 12px 24px;
  border-top: 1px solid var(--color-border-2);
}

/* 值班监控抽屉查询行：级联条件（分组/客服）+ 关键字 + 查询按钮 */
.rc-mon-tools { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.rc-mon-sel {
  height: 40px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: #fff;
}
.rc-mon-search {
  width: 100%;
  height: 40px;
  padding: 0 10px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: #fff;
  font-size: var(--fs-base);
  color: var(--color-text);
  outline: none;
}
.rc-mon-search:focus { border-color: var(--primary); }
.rc-mon-search::placeholder { color: var(--color-text-3); }
/* 名称关键字清除：输入框内右侧实心灰圆×（同知识库 .kb-sub-clear 图标），有值才显 */
.rc-mon-kwwrap { position: relative; min-width: 0; }
.rc-mon-kwwrap .rc-mon-search { padding-right: 32px; }
.rc-mon-clear {
  position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
  display: inline-flex; border: 0; padding: 0; background: none;
  color: var(--color-text-3); cursor: pointer;
}
.rc-mon-clear:hover { color: var(--color-text-2); }
.rc-page .rc-mon-tools .btn { height: 40px; border-radius: var(--radius-md); }
.rc-mon-empty { padding: 28px 0; text-align: center; font-size: var(--fs-aux); color: var(--color-text-3); }

/* 策略开关 */
.rc-switch {
  width: 36px;
  height: 20px;
  border-radius: 10px;
  background: #c9cdd4;
  position: relative;
  cursor: pointer;
  display: inline-block;
  vertical-align: middle;
  transition: background 0.15s;
}
.rc-switch i {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  transition: left 0.15s;
}
.rc-switch.on { background: var(--primary); }
.rc-switch.on i { left: 18px; }

/* 分流操作：文字链接样式 */
.rc-btn-manual {
  border: none;
  background: none;
  padding: 0;
  color: var(--primary);
  font-size: 12.5px;
  cursor: pointer;
  white-space: nowrap;
}
.rc-btn-manual:hover { color: var(--primary-hover); text-decoration: underline; }

.rc-empty { text-align: center; color: #8b92a1; padding: 28px 0; }
.rc-empty-sm { text-align: center; color: #8b92a1; font-size: 12px; padding: 8px 0; }
.rc-dim { color: #8b92a1; }

/* ---------- 表尾：分页器置底居中 ---------- */
.rc-page .rc-table-card { display: flex; flex-direction: column; }
.rc-page .rc-table-card .rc-wide { flex: 1; }
.rc-table-foot { display: flex; align-items: center; margin-top: auto; padding-top: 12px; }
.rc-pager { margin: 0 auto; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #445066; }
.rc-pg-size { width: 98px; height: 32px; border-radius: 8px; }
.rc-pg-btn {
  min-width: 30px;
  height: 30px;
  border: 1px solid #e5e9f0;
  background: #fff;
  border-radius: 6px;
  color: #445066;
  cursor: pointer;
  font-size: 12.5px;
}
.rc-pg-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
.rc-pg-btn.cur { border-color: var(--primary); background: var(--color-primary-light); color: var(--primary); font-weight: 700; }
.rc-pg-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.rc-pg-jump input {
  width: 46px;
  height: 30px;
  border: 1px solid #e5e9f0;
  border-radius: 6px;
  text-align: center;
  margin: 0 6px;
  color: #445066;
}

/* ---------- 转移会话弹窗：源信息条 + 目标客服左右两栏单选（左分组/右在线成员） ---------- */
.rc-trf-src {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  margin-bottom: 12px;
  background: var(--color-fill);
  border-radius: var(--radius-md);
}
.rc-trf-src b { font-size: var(--fs-base); color: var(--color-text); }
.rc-trf-src i { margin-left: auto; font-style: normal; font-size: var(--fs-aux); color: var(--color-text-3); }
.rc-trf-ava {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--color-primary-light);
  color: var(--color-primary);
  font-size: var(--fs-base);
  font-weight: 500;
}
.rc-trf-ava.sm { width: 24px; height: 24px; font-size: var(--fs-aux); }
.rc-trf-search { margin-bottom: 10px; }
.rc-trf-list {
  display: flex;
  align-items: stretch;
  max-height: 340px;
  border: 1px solid var(--color-border-2);
  border-radius: var(--radius-md);
  padding: 6px;
  background: #fff;
  overflow: hidden;
}
.rc-trf-col { overflow-y: auto; scrollbar-width: none; }
.rc-trf-col::-webkit-scrollbar { display: none; }
.rc-trf-col.left { width: 46%; flex: none; padding-right: 6px; border-right: 1px solid var(--color-border-2); }
.rc-trf-col.right { flex: 1; min-width: 0; padding-left: 6px; }
.rc-trf-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: var(--radius-md);
  font-size: var(--fs-base);
  color: var(--color-text-2);
  cursor: pointer;
  transition: background 0.15s;
}
.rc-trf-row + .rc-trf-row { margin-top: 2px; }
.rc-trf-row:hover { background: var(--color-primary-light-2); }
.rc-trf-row.on { background: var(--color-primary-light); color: var(--color-primary); font-weight: 600; }
.rc-trf-row.disabled,
.rc-trf-row.dim { color: var(--color-text-4); cursor: not-allowed; }
.rc-trf-row.disabled:hover,
.rc-trf-row.dim:hover { background: transparent; }
.rc-trf-group { font-weight: 600; color: var(--color-text); }
.rc-trf-group.on { color: var(--color-primary); }
/* 右列当前展示组底纹；选中态（.on）优先级更高覆盖 */
.rc-trf-list .rc-trf-group.active { background: var(--color-fill); }
.rc-trf-list .rc-trf-group.on { background: var(--color-primary-light); }
.rc-trf-member { padding-left: 10px; }
.rc-trf-gname,
.rc-trf-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rc-trf-count { flex: none; font-size: var(--fs-aux); color: var(--color-text-3); }
.rc-trf-row.on .rc-trf-count { color: var(--color-primary); }
.rc-trf-srctag {
  flex: none;
  padding: 0 6px;
  border-radius: var(--radius-xs);
  background: var(--color-warning-light);
  color: var(--color-warning);
  font-size: var(--fs-aux);
}
.rc-trf-check { width: 14px; flex: none; font-size: 12px; color: var(--color-primary); }
.rc-trf-empty { padding: 28px 0; text-align: center; font-size: var(--fs-base); color: var(--color-text-3); }

/* ---------- 智能分流页：分区 + 分组策略表 ---------- */
.rc-sec-title {
  font-size: 14px;
  font-weight: 600;
  color: #202532;
  position: relative;
  padding-left: 10px;
  margin: 4px 0 12px;
}
.rc-sec-title::before {
  content: '';
  position: absolute;
  left: 0;
  top: 3px;
  bottom: 3px;
  width: 3px;
  border-radius: 2px;
  background: var(--primary);
}
/* ---------- 智能分流页：分组策略表（组内按优先级升序） ---------- */
.rc-st-company { font-size: var(--fs-base); font-weight: 600; color: var(--text-2); margin-bottom: 10px; }
.rc-st-groups { display: flex; flex-direction: column; gap: 16px; }
.rc-st-group {
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.rc-st-ghead {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: var(--color-fill);
  border-bottom: 1px solid var(--color-border-2);
}
.rc-st-ghead b { font-size: var(--fs-base); color: var(--text-1); }
.rc-st-ghead .rc-dim { font-size: var(--fs-aux); }
.rc-st-table .th-name { width: 200px; }
.rc-st-table .th-op { width: 140px; }
.rc-st-table .op a { white-space: nowrap; }
.rc-st-row { cursor: pointer; }
.rc-st-row:hover { background: var(--color-primary-light-2); }
.rc-st-name { font-weight: 600; color: var(--text-1); }
.rc-st-id { font-size: var(--fs-aux); color: var(--color-text-3); margin-top: 2px; }
.rc-card {
  position: relative;
  background: #fff;
  border: 1px solid #e8ebf1;
  border-radius: 12px;
  padding: 14px;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.rc-card:hover { border-color: #c7d6ff; box-shadow: 0 4px 16px rgba(79, 124, 255, 0.12); }
.rc-card.mini { cursor: default; border-color: var(--primary); margin-bottom: 12px; }
.rc-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.rc-card-name { font-size: 14px; color: #202532; }
.rc-card-tags { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.rc-tag { font-size: 11.5px; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
.rc-tag.green { background: var(--color-success-light); color: var(--color-success); }
.rc-tag.orange { background: var(--color-warning-light); color: var(--color-warning); }
.rc-tag.blue { background: var(--color-primary-light); color: var(--color-primary); }

/* ---------- 策略详情抽屉 ---------- */
/* 弹层（选择账号等）需盖在抽屉之上 */
.pm-page.rc-page .mask { z-index: 1300; }
.rc-drawer-mask {
  position: fixed;
  inset: 0;
  background: rgba(31, 35, 41, 0.45);
  z-index: 1200;
  display: flex;
  justify-content: flex-end;
}
.rc-drawer {
  width: 920px;
  max-width: 94vw;
  height: 100%;
  background: #fff;
  display: flex;
  flex-direction: column;
  box-shadow: -8px 0 40px rgba(31, 35, 41, 0.16);
  animation: rc-drawer-in 0.2s ease;
}
@keyframes rc-drawer-in {
  from { transform: translateX(40px); opacity: 0.4; }
  to { transform: translateX(0); opacity: 1; }
}
.rc-drawer-title { padding: 15px 20px; font-size: 15px; font-weight: 700; color: #202532; border-bottom: 1px solid #edf0f5; }
.rc-drawer-main { flex: 1; display: flex; min-height: 0; }
.rc-drawer-left { width: 280px; flex: none; border-right: 1px solid #edf0f5; padding: 16px; overflow-y: auto; }
.rc-sub-title { font-size: 12px; color: #8b92a1; margin-bottom: 8px; }
.rc-add-sub { width: 100%; }
.rc-drawer-right { flex: 1; min-width: 0; padding: 16px 20px; overflow-y: auto; }
.rc-drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.rc-drawer-head b { font-size: 14px; color: #202532; }
.rc-drawer-btns { display: flex; gap: 8px; }
.rc-cfg-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: #f7f8fa;
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 8px;
  font-size: var(--fs-base);
  color: #445066;
}
.rc-cfg-row a { color: var(--primary); cursor: pointer; white-space: nowrap; }
.rc-cfg-row a:hover { text-decoration: underline; }
.rc-pill { display: inline-block; background: #eef1f6; color: #5b6475; border-radius: 4px; padding: 1px 8px; font-size: 11.5px; }
.rc-pill.blue { background: var(--color-primary-light); color: var(--color-primary); }

/* 分流模式区块 */
.rc-mode-box { border: 1px solid #e8ebf1; border-radius: 10px; padding: 14px; margin-top: 4px; }
.rc-seg-tabs { display: inline-flex; background: #f2f3f5; border-radius: 8px; padding: 3px; gap: 2px; margin-bottom: 12px; }
.rc-seg-tabs button {
  border: none;
  background: transparent;
  padding: 5px 14px;
  border-radius: 6px;
  font-size: 12.5px;
  color: #445066;
  cursor: pointer;
}
.rc-seg-tabs button.cur { background: #fff; color: var(--primary); font-weight: 600; box-shadow: 0 1px 4px rgba(26, 34, 56, 0.1); }
.rc-mode-line { display: flex; align-items: center; gap: 8px; font-size: var(--fs-base); color: #445066; margin-bottom: 10px; }
.rc-mode-radios { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.rc-radio { display: flex; align-items: center; gap: 6px; font-size: var(--fs-base); color: #445066; cursor: pointer; }
.rc-radio b { font-weight: 600; }
.rc-radio span { color: #8b92a1; font-size: 12px; }
.rc-mode-metrics { display: flex; gap: 16px; margin-bottom: 12px; font-size: var(--fs-base); color: #445066; flex-wrap: wrap; }
.rc-mode-metrics label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.rc-rules { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.rc-rule { display: flex; align-items: center; gap: 8px; font-size: var(--fs-base); color: #445066; flex-wrap: wrap; }
.rc-rule-kw { color: var(--primary); font-weight: 700; width: 64px; text-align: center; }
.rc-rule-conj { width: 64px; height: 32px; border-radius: 8px; }
.rc-rule-v { width: 64px; height: 32px; border-radius: 8px; text-align: center; }
.pm-page.rc-page .rc-rule-v { width: 64px; flex: none; }
.rc-people-head { display: flex; align-items: center; font-size: var(--fs-base); font-weight: 700; color: #202532; margin-bottom: 8px; }
.rc-people-head a { margin-left: auto; color: var(--primary); font-weight: 400; cursor: pointer; }
.rc-people-head a:hover { text-decoration: underline; }
.rc-people-box {
  border: 1px solid #e5e9f0;
  border-radius: 10px;
  padding: 10px 12px;
  font-size: var(--fs-base);
  color: #445066;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  min-height: 42px;
}
.rc-people-chip { background: var(--primary-light); color: var(--primary); border-radius: 6px; padding: 2px 10px; }

/* ---------- 选择账号弹窗 ---------- */
.rc-pick-panes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.rc-pick-pane { border: 1px solid #e5e9f0; border-radius: 10px; padding: 10px; max-height: 320px; overflow-y: auto; }
.rc-pick-block { margin-bottom: 10px; }
.rc-pick-block:last-child { margin-bottom: 0; }
.rc-pick-group { font-size: 12px; color: #8b92a1; margin-bottom: 6px; }
.rc-pick-item { display: flex; align-items: center; gap: 8px; font-size: var(--fs-base); color: #445066; padding: 4px 0; cursor: pointer; }

/* =========================================================
   实时客服接待（平台账号接待监控）
   UX 重构：顶栏（tab+统计）/ 工具栏（筛选+操作）/ 单列店铺流 + 高密账号卡
   功能与截图版一致
   ========================================================= */
.rc-live { display: flex; flex-direction: column; gap: 12px; }
.rc-live > .qc-body { flex: 0 0 auto; }

/* ── 顶栏：平台 tab 左 + 实时统计右 ── */
.rc-live-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px 16px;
  flex-wrap: wrap;
  padding: 10px 16px;
}
.rc-live-tabs { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.rc-live-tab {
  height: 32px;
  display: inline-flex;
  align-items: center;
  padding: 0 16px;
  border-radius: var(--radius-md);
  font-size: var(--fs-base);
  color: var(--color-text-3);
  cursor: pointer;
  white-space: nowrap;
  transition: color .15s, background .15s, box-shadow .15s;
}
.rc-live-tab:hover { color: var(--color-text-2); background: var(--color-fill-2); }
.rc-live-tab.cur { background: var(--primary); color: #fff; font-weight: 600; box-shadow: var(--shadow-sm); }
.rc-live-stats { display: flex; gap: 8px; flex-wrap: wrap; }
.rc-live-stat {
  padding: 3px 10px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}
.rc-live-stat.green { color: var(--color-success); background: var(--color-success-light); }
.rc-live-stat.yellow { color: var(--color-warning); background: var(--color-warning-light); }
.rc-live-stat.red { color: var(--color-danger); background: var(--color-danger-light); }
/* 顶栏统计可点联动视图 */
.rc-live-stat.click { cursor: pointer; transition: box-shadow .15s; }
.rc-live-stat.click:hover,
.rc-live-stat.click.on { box-shadow: inset 0 0 0 1px currentColor; }

/* ── 视图切换条：异常驱动分段器（Ant Segmented 语言） ── */
.rc-live-viewbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 2px 12px; flex-wrap: wrap; }
.rc-viewseg { display: inline-flex; gap: 2px; background: var(--color-fill-2); border-radius: var(--radius-md); padding: 2px; }
.rc-viewseg button {
  display: inline-flex; align-items: center; gap: 6px;
  border: none; background: transparent; font-family: inherit;
  padding: 4px 14px; border-radius: var(--radius-sm);
  font-size: 12.5px; color: var(--color-text-2); cursor: pointer;
  transition: color .15s, background .15s;
}
.rc-viewseg button:hover { color: var(--color-text); }
.rc-viewseg button.on { background: #fff; color: var(--color-text); font-weight: 600; box-shadow: var(--shadow-sm); }
.rc-viewseg button i { font-style: normal; font-size: 11px; color: var(--color-text-4); }
.rc-viewseg button.on i { color: var(--primary); }
.rc-viewseg button i.hot { color: var(--color-danger); }
/* 视图条左侧：分段器 + 排序段同行 */
.rc-viewbar-left { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
/* 卡片态排序段：与 SortTh 同款 caret 视觉，点击降序→升序→取消 */
.rc-sortseg { display: inline-flex; align-items: center; gap: 2px; }
.rc-sortseg-label { font-size: 12px; color: var(--color-text-3); margin-right: 4px; }
.rc-sortseg button {
  display: inline-flex; align-items: center; gap: 4px;
  border: none; background: transparent; font-family: inherit;
  padding: 4px 8px; border-radius: var(--radius-sm);
  font-size: 12.5px; color: var(--color-text-3); cursor: pointer;
  transition: color .15s, background .15s;
}
.rc-sortseg button:hover { color: var(--color-text); }
.rc-sortseg button.on { color: var(--primary); background: var(--color-primary-light); font-weight: 600; }

/* ── 工具栏：筛选左 + 操作右 ── */
.rc-live-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px 16px;
  flex-wrap: wrap;
  padding: 12px 16px;
}
.rc-live-filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rc-live-filters .rc-bs { width: 132px; flex: none; }
.rc-toolbar-div { width: 1px; height: 20px; background: var(--color-border); margin: 0 4px; }
.rc-live-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.rc-warn-tip { font-size: 12px; color: var(--color-danger); }
.rc-updated { font-size: 12px; color: var(--color-text-3); white-space: nowrap; }

/* ── 店铺流：单列全宽卡 ── */
.rc-live-stores { display: flex; flex-direction: column; gap: 16px; }
.rc-live-empty { padding: 60px 0; text-align: center; color: var(--color-text-3); font-size: var(--fs-base); }
.rc-store { padding: 16px; box-shadow: var(--shadow-md); display: flex; flex-direction: column; gap: 12px; }
.rc-store-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.rc-store-name { font-size: 15px; font-weight: 700; color: var(--color-text); }
.rc-store-m { font-size: 12.5px; color: var(--color-text-3); white-space: nowrap; }
.rc-store-m b { color: var(--color-text-2); font-weight: 600; }
.rc-store-m b.red { color: var(--color-danger); }
.rc-store-sp { flex: 1; }
.rc-link { color: var(--primary); cursor: pointer; white-space: nowrap; transition: color .15s; }
.rc-link:hover { color: var(--primary-hover); text-decoration: underline; }

/* 不分流账号：浅底信息条 */
.rc-noroute {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 10px;
  border-radius: var(--radius-md);
  background: var(--color-fill);
  font-size: 12.5px;
}
.rc-noroute b { color: var(--color-warning); white-space: nowrap; }
.rc-noroute-txt {
  color: var(--color-text-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
  min-width: 0;
}

/* ── 账号卡片：网格卡片（业务反馈卡片化，字段/交互与表版一致） ── */
.rc-acc-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.rc-acc-card {
  display: flex; flex-direction: column; gap: 10px;
  padding: 12px 14px;
  border: 1px solid var(--color-border-2); border-radius: var(--radius-md);
  background: #fff;
  transition: border-color .15s, box-shadow .15s;
}
.rc-acc-card:hover { border-color: var(--color-border); box-shadow: var(--shadow-sm); }
/* 异常优先：未回复账号卡片浅红提示（原 --color-danger-light 整卡填充过深，降为极浅红底 + 浅红描边，保留辨识度不糊卡面） */
.rc-acc-card.alert { background: #fff7f5; border-color: #ffd4cc; }
.rc-acc-card.alert:hover { border-color: #ffd4cc; box-shadow: var(--shadow-sm); }
.rc-card-head { display: flex; align-items: flex-start; gap: 6px; }
/* 卡片内在线状态横排右置 */
.rc-card-head .rc-td-net { flex-direction: row; align-items: center; gap: 4px; margin-left: auto; flex: none; }
.rc-card-metrics { display: flex; align-items: baseline; gap: 24px; }
.rc-card-m { display: inline-flex; align-items: baseline; gap: 6px; font-size: 12px; color: var(--color-text-3); white-space: nowrap; }
.rc-card-m b { font-size: 15px; font-weight: 700; color: var(--color-text); }
.rc-card-m b.red { color: var(--color-danger); }
/* 卡底：开关左 + 操作右，细分割线上下区隔 */
.rc-card-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding-top: 10px; border-top: 1px solid var(--color-border-2);
}
.rc-card-ctrls { display: inline-flex; align-items: center; gap: 14px; }
.rc-card-ctrl { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-text-3); white-space: nowrap; }
.rc-card-ops { flex-direction: row; align-items: center; gap: 12px; }
/* 下级客服：卡内浅底子列表 */
.rc-card-staff { display: flex; flex-direction: column; gap: 8px; padding: 8px 10px; border-radius: var(--radius-sm); background: var(--color-fill); }
.rc-card-staff-row { display: flex; align-items: center; gap: 16px; }
.rc-card-staff-row .rc-sub-main { flex: 1; min-width: 0; }
.rc-acc-empty { text-align: center; color: var(--color-text-3); padding: 24px 0; font-size: var(--fs-base); }
/* 名称/ID 两行同左缘，整体位于 caret 之后 */
.rc-acc-main { min-width: 0; flex: 1; }
.rc-acc-name {
  display: block;
  font-size: var(--fs-base);
  font-weight: 500;
  color: var(--color-text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 280px;
}
.rc-acc-id { font-size: 12px; color: var(--color-text-4); margin-top: 4px; }
/* 在线状态：PC/移动 上下排布标签（离线灰 / 在线绿） */
.rc-td-net { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.rc-net-chip {
  padding: 1px 8px; border: 1px solid var(--color-border); border-radius: var(--radius-sm);
  font-size: 12px; color: var(--color-text-3); white-space: nowrap;
}
.rc-net-chip.on { color: var(--color-success); border-color: var(--color-success); background: var(--color-success-light); }
/* 账号行展开角标：与品控系列列表同款 chevron（灰、展开旋转 90°） */
.rc-acc-caret {
  display: inline-flex; align-items: center; border: 0; background: none; padding: 0;
  color: var(--color-text-3); cursor: pointer; transition: transform .15s; flex-shrink: 0;
}
.rc-acc-caret:hover { color: var(--primary); }
.rc-acc-caret.open { transform: rotate(90deg); }
/* 无下级账号占位，保证名称列对齐 */
.rc-acc-caret.ph { visibility: hidden; }
/* 客服子列表：浅底 + 整块缩进（caret 12 + flex gap 6），客服名/分组同左缘且与账号名对齐 */
.rc-sub-main { padding-left: 18px; }
.rc-sub-name { font-size: 12.5px; font-weight: 500; color: var(--color-text-2); }
.rc-td-dash { color: var(--color-text-4); }
.rc-pull {
  border: none;
  background: transparent;
  padding: 0;
  font-family: inherit;
  font-size: var(--fs-base);
  color: var(--primary);
  cursor: pointer;
  white-space: nowrap;
  transition: color .15s;
}
.rc-pull:hover { color: var(--primary-hover); text-decoration: underline; }
/* 转移：与拉取同款的文本操作按钮 */
.rc-transfer {
  border: none;
  background: transparent;
  padding: 0;
  font-family: inherit;
  font-size: var(--fs-base);
  color: var(--primary);
  cursor: pointer;
  white-space: nowrap;
  transition: color .15s;
}
.rc-transfer:hover { color: var(--primary-hover); text-decoration: underline; }

/* 查看更多 */
.rc-more {
  text-align: center;
  font-size: 12.5px;
  color: var(--color-text-3);
  cursor: pointer;
  transition: color .15s;
}
.rc-more:hover { color: var(--primary); }

/* ---------- 接待记录弹窗（大）：三维度筛选 + 三栏（客服/会话/聊天） ---------- */
.rcm-mask {
  position: fixed;
  inset: 0;
  background: rgba(31, 35, 41, 0.45);
  z-index: 1250;
  display: flex;
  align-items: center;
  justify-content: center;
}
.rcm-modal {
  width: 1280px;
  max-width: 94vw;
  height: min(840px, 88vh);
  background: #fff;
  border-radius: var(--radius-2xl);
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: rcm-in 0.18s ease;
}
@keyframes rcm-in {
  from { transform: translateY(14px); opacity: 0.5; }
  to { transform: none; opacity: 1; }
}
.rcm-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--color-border-2);
  flex: none;
}
.rcm-head b { font-size: var(--fs-lg); color: var(--color-text); }
.rcm-x {
  margin-left: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border: none;
  border-radius: var(--radius-xs);
  background: none;
  color: var(--color-text-3);
  cursor: pointer;
  transition: color .15s, background .15s;
}
.rcm-x:hover { color: var(--text-2); background: var(--color-fill-2); }
/* 三维度筛选条（公司/分组/客服 级联） */
.rcm-filters { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid var(--color-border-2); flex: none; }
.rcm-f-item { display: flex; align-items: center; gap: 8px; }
.rcm-f-item i { font-style: normal; font-size: var(--fs-base); color: var(--text-2); }
.rcm-f-sel { width: 170px; }
/* 顶部查询行内的两个搜索框（客服名/用户名）；特异性压过基础层 .input 的 width:100% */
.rcm-filters input.rcm-f-search { width: 200px; flex: none; }
/* 三栏主体 */
.rcm-body { flex: 1; display: grid; grid-template-columns: 260px 380px 1fr; min-height: 0; }
.rcm-col { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.rcm-col + .rcm-col { border-left: 1px solid var(--color-border-2); }
/* 列头状态 tab：下划线式（同页级 tab 语言），搜索已上移顶部查询行 */
.rcm-tabs { display: flex; align-items: center; gap: 16px; padding: 0 12px; border-bottom: 1px solid var(--color-border-2); flex: none; }
.rcm-tabs button {
  position: relative;
  border: none;
  background: transparent;
  font-family: inherit;
  padding: 10px 2px;
  font-size: var(--fs-base);
  color: var(--color-text-2);
  cursor: pointer;
  transition: color 0.15s;
}
.rcm-tabs button:hover { color: var(--primary); }
.rcm-tabs button.on { color: var(--primary); font-weight: 600; }
.rcm-tabs button.on::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 2px;
  background: var(--primary);
}
.rcm-alist, .rcm-slist { flex: 1; overflow-y: auto; scrollbar-width: none; }
.rcm-alist::-webkit-scrollbar, .rcm-slist::-webkit-scrollbar { display: none; }
.rcm-empty { text-align: center; font-size: var(--fs-aux); color: var(--color-text-3); padding: 28px 0; }
/* ① 客服卡 */
.rcm-agent { display: flex; align-items: center; gap: 10px; padding: 12px; cursor: pointer; }
.rcm-agent:hover { background: var(--color-primary-light-2); }
.rcm-agent.on { background: var(--color-primary-light); }
.rcm-ava {
  flex: none;
  position: relative;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: var(--fs-md);
  font-weight: 500;
  background: linear-gradient(135deg, var(--primary), var(--primary-hover));
}
/* 状态圆形角标：头像右下角（在线绿/小休橙/离线灰） */
.rcm-sbadge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 2px solid #fff;
  background: var(--color-text-4);
}
.rcm-sbadge.on { background: var(--color-success); }
.rcm-sbadge.rest { background: var(--color-warning); }
.rcm-ainfo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.rcm-ainfo b { font-size: var(--fs-base); color: var(--color-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rcm-ainfo i { font-style: normal; font-size: var(--fs-aux); color: var(--color-text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* ② 会话项（回复状态标签 + 预览） */
.rcm-sess { padding: 12px; cursor: pointer; border-bottom: 1px solid var(--color-border-2); }
.rcm-sess:hover { background: var(--color-primary-light-2); }
.rcm-sess.on { background: var(--color-primary-light); }
.rcm-sess-top { display: flex; align-items: flex-start; gap: 6px; min-width: 0; }
.rcm-buyer { font-size: var(--fs-base); font-weight: 600; color: var(--color-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 时间右对齐置顶；回复状态标签下移至预览行右侧 */
.rcm-time { flex: none; margin-left: auto; font-size: var(--fs-aux); color: var(--color-text-3); }
/* 预览文字与标签同排：文字弹性收窄+省略号，与标签保 8px 疏远；行间距 8px */
.rcm-sess-mid { display: flex; align-items: center; gap: 8px; margin-top: 8px; min-width: 0; }
.rcm-rtag { flex: none; font-size: var(--fs-aux); line-height: 18px; padding: 0 6px; border-radius: var(--radius-xs); }
.rcm-rtag.ok { background: var(--color-success-light); color: var(--color-success); }
.rcm-rtag.warn { background: var(--color-warning-light); color: var(--color-warning); }
.rcm-rtag.bad { background: var(--color-danger-light); color: var(--color-danger); }
.rcm-preview { flex: 1; min-width: 0; font-size: var(--fs-aux); color: var(--color-text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* ③ 聊天栏 */
.rcm-chead { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--color-border-2); flex: none; }
.rcm-reddot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--color-danger); }
.rcm-plat { flex: none; font-size: var(--fs-aux); line-height: 18px; padding: 0 6px; border-radius: var(--radius-xs); background: var(--color-primary-light); color: var(--primary); }
.rcm-shop { font-size: var(--fs-aux); color: var(--color-text-3); }
.rcm-scope { width: 100px; margin-left: auto; flex: none; }
.rcm-cbody { flex: 1; overflow-y: auto; padding: 16px; background: var(--color-bg); scrollbar-width: none; }
.rcm-cbody::-webkit-scrollbar { display: none; }
.rcm-chat-empty { margin: auto; }
/* 聊天消息流（头像 chip + 发送方·时间元信息行 + 气泡）；头像类名 mava 避开客服卡 ava */
.rcm-chat { display: flex; flex-direction: column; gap: 16px; }
.rcm-chat-end { text-align: center; font-size: var(--fs-aux); color: var(--color-text-3); }
.rcm-msg { display: flex; gap: 10px; align-items: flex-start; }
.rcm-msg.r { flex-direction: row-reverse; }
.rcm-mava {
  flex: none;
  width: 26px;
  height: 26px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--fs-aux);
  font-weight: 500;
}
.rcm-mava.buy { background: var(--color-primary-light); color: var(--color-primary); }
.rcm-mava.ai { background: var(--color-success-light); color: var(--color-success); }
.rcm-mava.me { background: var(--color-primary); color: #fff; }
.rcm-msg-main { max-width: 62%; display: flex; flex-direction: column; gap: 5px; }
.rcm-msg.r .rcm-msg-main { align-items: flex-end; }
.rcm-msg-meta { font-size: var(--fs-aux); color: var(--color-text-3); }
.rcm-bubble {
  padding: 9px 12px;
  border-radius: var(--radius-md);
  background: #fff;
  border: 1px solid var(--color-border);
  font-size: var(--fs-base);
  color: var(--color-text);
  line-height: 1.5;
  word-break: break-word;
}
.rcm-bubble.ai { background: var(--color-success-light); border-color: transparent; }
.rcm-bubble.me { background: var(--color-primary-light); border-color: transparent; }
.rcm-ord-no { font-size: var(--fs-aux); opacity: .85; margin-bottom: 6px; }
.rcm-ord-goods { display: flex; align-items: center; gap: 8px; }
.rcm-ord-emoji { font-size: 22px; }
.rcm-ord-title { font-size: var(--fs-base); }
.rcm-ord-price { margin-top: 6px; font-weight: 600; }
.rcm-inv { display: flex; align-items: center; gap: 10px; }
.rcm-inv-ico { font-size: 22px; }
.rcm-inv-t { font-size: var(--fs-base); font-weight: 600; }
.rcm-inv-d { font-size: var(--fs-aux); opacity: .8; }

/* ---------- 实时监控图表弹窗（视觉对标知识库趋势图弹窗，尺寸加大一档） ---------- */
.rc-monchart-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
.rc-monchart-chips { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rc-monchart-chip {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px;
  border: 1px solid var(--color-border); border-radius: 999px; background: #fff;
  font-size: var(--fs-base); color: var(--color-text-2); cursor: pointer; font-family: inherit;
}
.rc-monchart-chip:hover { border-color: var(--color-primary); color: var(--color-primary); }
.rc-monchart-chip i { width: 8px; height: 8px; border-radius: 50%; }
.rc-monchart-chip b { color: var(--color-text); font-variant-numeric: tabular-nums; }
.rc-monchart-chip.off { color: var(--color-text-4); border-style: dashed; }
.rc-monchart-chip.off b { color: var(--color-text-4); }
.rc-monchart-range { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rc-monchart-seg { display: inline-flex; border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
.rc-monchart-seg button {
  height: 32px; padding: 0 14px; border: none; background: #fff; font-family: inherit;
  font-size: var(--fs-base); color: var(--color-text-2); cursor: pointer; border-right: 1px solid var(--color-border);
}
.rc-monchart-seg button:last-child { border-right: none; }
.rc-monchart-seg button.active { background: var(--color-primary-light); color: var(--color-primary); font-weight: 600; }
.rc-monchart-card { position: relative; border: 1px solid var(--color-border-2); border-radius: var(--radius-lg); background: var(--color-fill); padding: 12px 12px 6px; }
/* 口径文案独立成行（非浮层），趋势图内容永不遮指标/口径文字 */
.rc-monchart-cap { display: block; text-align: right; font-size: var(--fs-aux); color: var(--color-text-3); margin: 0 2px 4px; }
.rc-monchart-wrap { position: relative; }
.rc-monchart-svg { width: 100%; height: auto; display: block; }
.rc-monchart-svg .ax { font-size: 11px; fill: var(--color-text-3); }
.rc-monchart-svg .ax-cap { font-size: 11px; fill: var(--color-text-3); }
/* 秒轴（均响）刻度与表头：橙色与序列同色 */
.rc-monchart-svg .ax-s { fill: var(--color-warning); }
.rc-monchart-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: var(--fs-base); color: var(--color-text-3); }
.rc-monchart-tip {
  position: absolute; z-index: 2; min-width: 176px; padding: 8px 10px; pointer-events: none;
  background: #fff; border: 1px solid var(--color-border); border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
}
.rc-monchart-tip-date { font-size: var(--fs-aux); color: var(--color-text-3); margin-bottom: 4px; }
.rc-monchart-tip-line { display: flex; align-items: center; gap: 6px; font-size: var(--fs-aux); color: var(--color-text-2); }
.rc-monchart-tip-line i { width: 8px; height: 8px; border-radius: 50%; }
.rc-monchart-tip-line b { margin-left: auto; color: var(--color-text); font-variant-numeric: tabular-nums; }

</style>
