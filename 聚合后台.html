<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>聚合后台</title>
<style>
/* =========================================================
   Funion 全局设计 Token（唯一取值来源，禁止在业务 CSS 里另创新值）
   统一标准 = 智能运营中心设计语言：#4f7cff 主色 / 14px 正文字号 /
   10px 圆角控件 / 16px 圆角白卡 / 柔和阴影
   ========================================================= */
:root {
  /* ── 主色族 ── */
  --color-primary: #4f7cff;
  --color-primary-hover: #6b90ff;
  --color-primary-light: #eef3ff; /* 标签 / 选中态浅底 */
  --color-primary-light-2: #f5f8ff; /* 悬浮浅底 */
  --color-primary-10: rgba(79, 124, 255, 0.1);

  /* ── 状态色（仅用于语义状态，不得自增色值） ── */
  --color-success: #00b42a;
  --color-success-light: #e8ffea;
  --color-warning: #ff7d00;
  --color-warning-light: #fff7e8;
  --color-danger: #f53f3f;
  --color-danger-light: #ffece8;

  /* ── 文本层级：标题 / 正文 / 辅助 / 占位 ── */
  --color-text: #202532;
  --color-text-2: #445066;
  --color-text-3: #8b92a1;
  --color-text-4: #c9cdd4;

  /* ── 边框与填充 ── */
  --color-border: #e8ebf1; /* 卡片 / 控件边框 */
  --color-border-2: #f0f3f7; /* 分隔线 / 表格行线 */
  --color-fill: #fbfcfe; /* 控件 / 表头浅填充 */
  --color-fill-2: #f2f3f7; /* 分组 / 悬浮填充 */
  --color-bg: #f5f7fb; /* 页面底色 */
  --color-bg-header: #ececf4;
  --color-bg-sidebar: #fafafc;

  /* ── 字号层级（辅助 / 正文 / 副标题 / 模块标题 / 弹窗标题） ── */
  --fs-aux: 12px;
  --fs-base: 14px; /* 正文默认（用户定案 2026-09：13 → 14） */
  --fs-md: 15px;
  --fs-lg: 16px;
  --fs-title: 17px;

  /* ── 字重层级（PingFang SC 三档；700 及以上禁用，浏览器合成假粗体） ── */
  --fw-regular: 400; /* 正文 / 表格单元格 / 按钮与操作链接 / 表单控件 */
  --fw-medium: 500; /* 表头 / 选中激活态 / 标签徽章 / 列表主文 / kv 键 */
  --fw-semibold: 600; /* 标题 / 品牌字 / 数字强调 */

  /* ── 圆角阶梯 ── */
  --radius-xs: 4px; /* 小标签 */
  --radius-sm: 6px; /* 分页按钮等小控件 */
  --radius-md: 8px; /* chip / 小卡片 */
  --radius-lg: 10px; /* 输入件 / 按钮 / 气泡弹层 */
  --radius-xl: 12px; /* 面板卡片 */
  --radius-2xl: 16px; /* 工作区大卡片 */

  /* ── 阴影阶梯 ── */
  --shadow-sm: 0 1px 4px rgba(26, 34, 56, 0.08); /* 附着小浮层 / 激活态 */
  --shadow-md: 0 8px 28px rgba(26, 34, 56, 0.05); /* 卡片 */
  --shadow-lg: 0 10px 30px rgba(26, 34, 56, 0.12); /* 弹窗 / 下拉气泡 */

  /* ── 布局尺寸 ── */
  --header-height: 60px;
  --sidebar-width: 138px;

  font-family: 'PingFang SC', 'Helvetica Neue', Helvetica, 'Segoe UI', Arial,
    sans-serif;
  color: var(--color-text);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body,
#root {
  height: 100%;
}

button {
  font-family: inherit;
}

/* 全局通用：单行省略 + 悬浮白色气泡展示完整内容（Ellipsis 组件） */
.ell-wrap {
  display: inline-block;
  max-width: 100%;
  min-width: 0;
  position: relative;
  vertical-align: bottom;
}
.ell-inner {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ell-tip {
  position: fixed;
  background: #fff;
  border: 1px solid #e8ebf1;
  border-radius: 10px;
  box-shadow: 0 10px 30px rgba(26, 34, 56, 0.12);
  padding: 8px 12px;
  font-size: 12px;
  font-weight: 400;
  color: #445066;
  white-space: normal;
  width: max-content;
  max-width: 360px;
  line-height: 1.6;
  /* Teleport 至 body 的悬浮提示：需压过抽屉/弹窗遮罩（1000/1010）与弹层（4100/4300） */
  z-index: 4500;
  pointer-events: none;
}
/* =========================================================
   Funion 权限管理 · 成员管理（移植自原型 style.css，作用域 .pm-page）
   ========================================================= */

.pm-page {
  /* 主色（统一引用全局 token） */
  --primary: var(--color-primary);
  --primary-hover: var(--color-primary-hover);
  --primary-light: var(--color-primary-light);
  --primary-light-2: var(--color-primary-light-2);

  /* 功能色 */
  --success: var(--color-success);
  --success-light: var(--color-success-light);
  --danger: var(--color-danger);
  --danger-light: var(--color-danger-light);
  --warning: var(--color-warning);
  --warning-light: var(--color-warning-light);

  /* 文本 */
  --text-1: var(--color-text);
  --text-2: var(--color-text-2);
  --text-3: var(--color-text-3);
  --text-4: var(--color-text-4);

  /* 边框 & 背景 */
  --border: var(--color-border);
  --border-2: var(--color-border-2);
  --fill-1: var(--color-fill);
  --fill-2: var(--color-fill-2);
  --fill-3: #e5e6eb;
  --white: #FFFFFF;

  /* 尺寸 */
  --radius-sm: var(--radius-xs);
  --radius: var(--radius-sm);
  --radius-lg: var(--radius-md);
  --shadow: var(--shadow-sm);
  --shadow-lg: var(--shadow-lg);

  display: flex;
  flex-direction: column;
  height: 100%;
  min-width: 0;
  font-size: var(--fs-base);
  color: var(--text-1);
  background: var(--color-bg);
}

.pm-page button,
.pm-page input,
.pm-page select {
  font-family: inherit;
  font-size: inherit;
  outline: none;
}
/* 筛选输入件字号与全局筛选控件统一 */
.pm-page input,
.pm-page select {
  font-size: var(--fs-base);
}

.pm-page a {
  text-decoration: none;
  color: inherit;
}

/* ---------- 子 tab ---------- */
.pm-page .subtabs {
  height: 46px;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 28px;
  flex-shrink: 0;
}

.pm-page .subtabs a {
  font-size: 14px;
  color: var(--text-2);
  height: 46px;
  display: flex;
  align-items: center;
  position: relative;
  cursor: pointer;
}

.pm-page .subtabs a:hover { color: var(--text-1); }
.pm-page .subtabs a.active { color: var(--primary); font-weight: 600; }

.pm-page .subtabs a.active::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 2px;
  background: var(--primary);
}

/* ---------- 工作区：左树 + 右内容 ---------- */
.pm-page .workspace { flex: 1; display: flex; min-height: 0; }

.pm-page .tree-panel {
  width: 240px;
  background: var(--white);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.pm-page .tree-search {
  padding: 12px;
  display: flex;
  gap: 8px;
  border-bottom: 1px solid var(--border-2);
}

.pm-page .tree-body { flex: 1; overflow-y: auto; padding: 6px 8px; }

.pm-page .content-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--white);
}

.pm-page .content-head {
  padding: 16px 20px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.pm-page .content-head .title { font-size: 15px; font-weight: 600; color: var(--text-1); }
.pm-page .content-head .actions { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.pm-page .content-body { flex: 1; overflow: auto; padding: 0 20px 20px; }

/* ---------- 树 ---------- */
.pm-page .tree-node { user-select: none; }

.pm-page .tree-item {
  display: flex;
  align-items: center;
  height: 44px;
  padding: 0 8px;
  border-radius: var(--radius);
  cursor: pointer;
  color: var(--text-1);
  gap: 4px;
  position: relative;
}

.pm-page .tree-item:hover { background: var(--fill-1); }
.pm-page .tree-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }

.pm-page .tree-item .arrow {
  width: 16px;
  height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-3);
  transition: transform .15s;
  flex-shrink: 0;
}

.pm-page .tree-item .arrow.open { transform: rotate(90deg); }
.pm-page .tree-item .arrow.leaf { visibility: hidden; }

.pm-page .tree-item .label {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: var(--fs-base);
}

.pm-page .tree-item .node-more {
  opacity: 0;
  width: 20px;
  height: 20px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-3);
}

.pm-page .tree-item:hover .node-more { opacity: 1; }
.pm-page .tree-item .node-more:hover { background: var(--fill-3); color: var(--text-1); }
.pm-page .tree-children { padding-left: 16px; }
.pm-page .tree-children.collapsed { display: none; }

/* ---------- 按钮 ---------- */
.pm-page .btn {
  height: 32px;
  padding: 0 15px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--white);
  color: var(--text-1);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: var(--fs-base);
  transition: all .15s;
  white-space: nowrap;
}

.pm-page .btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light-2); }
.pm-page .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.pm-page .btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); color: #fff; }
.pm-page .btn.danger { color: var(--danger); }
.pm-page .btn.danger:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-light); }
.pm-page .btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
.pm-page .btn:disabled { opacity: .5; cursor: not-allowed; }
.pm-page .btn .ic { width: 14px; height: 14px; }

/* ---------- 输入 ---------- */
.pm-page .input {
  height: 32px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0 10px;
  background: var(--white);
  color: var(--text-1);
  transition: border-color .15s;
  width: 100%;
}

.pm-page .input:focus { border-color: var(--primary); }
.pm-page .input::placeholder { color: var(--text-4); }
.pm-page .input-icon { position: relative; flex: 1; }
.pm-page .input-icon .input { padding-left: 30px; }

.pm-page .input-icon .ic {
  position: absolute;
  left: 9px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-3);
  pointer-events: none;
  display: inline-flex;
}

.pm-page .select {
  height: 32px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0 10px;
  background: var(--white);
  cursor: pointer;
  color: var(--text-1);
}

.pm-page .select:focus { border-color: var(--primary); }

.pm-page .form-item { margin-bottom: 18px; }
.pm-page .form-item > label { display: block; margin-bottom: 6px; font-size: var(--fs-base); color: var(--text-1); }
.pm-page .form-tip { font-size: 12px; color: var(--text-3); margin-top: 4px; }

/* ---------- 表格 ---------- */
.pm-page .table { width: 100%; border-collapse: collapse; }

.pm-page .table thead th {
  background: var(--fill-1);
  color: var(--text-2);
  font-weight: 500;
  font-size: var(--fs-base);
  text-align: left;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

.pm-page .table tbody td {
  padding: 12px;
  border-bottom: 1px solid var(--border-2);
  color: var(--text-1);
  vertical-align: middle;
}

.pm-page .table tbody tr:hover { background: var(--fill-1); }
.pm-page .table .col-name { font-weight: 500; }
.pm-page .table .link { color: var(--primary); cursor: pointer; }
.pm-page .table .link:hover { text-decoration: underline; }
.pm-page .table .op { display: flex; gap: 14px; align-items: center; }
.pm-page .table .op a { color: var(--primary); cursor: pointer; }
.pm-page .table .op a.danger { color: var(--danger); }
.pm-page .table .op a:hover { opacity: .8; }
.pm-page .table .check { width: 40px; }

/* 复选 */
.pm-page .checkbox { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
.pm-page .checkbox input { display: none; }

.pm-page .checkbox .box {
  width: 16px;
  height: 16px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
  flex-shrink: 0;
}

.pm-page .checkbox .box svg { opacity: 0; color: #fff; }
.pm-page .checkbox input:checked + .box { background: var(--primary); border-color: var(--primary); }
.pm-page .checkbox input:checked + .box svg { opacity: 1; }
.pm-page .checkbox input:indeterminate + .box { background: var(--primary); border-color: var(--primary); }

.pm-page .checkbox input:indeterminate + .box::after {
  content: "";
  width: 8px;
  height: 2px;
  background: #fff;
}

.pm-page .checkbox input:indeterminate + .box svg { opacity: 0; }
.pm-page .checkbox.disabled { cursor: not-allowed; }
.pm-page .checkbox input:disabled + .box { background: var(--fill-2); border-color: var(--border); }
.pm-page .mtr-row.disabled { opacity: .5; cursor: not-allowed; }
.pm-page .mtr-row.disabled:hover { background: transparent; }

/* ---------- 状态点 & 标签 ---------- */
.pm-page .status { display: inline-flex; align-items: center; gap: 6px; }
.pm-page .status .dot { width: 7px; height: 7px; border-radius: 50%; }
.pm-page .status.normal .dot { background: var(--success); }
.pm-page .status.frozen .dot { background: var(--danger); }
.pm-page .status.pending .dot { background: var(--text-4); }

.pm-page .tag {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 8px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  background: var(--fill-2);
  color: var(--text-2);
  gap: 4px;
  margin: 2px;
}

.pm-page .tag.blue { background: var(--primary-light); color: var(--primary); }
.pm-page .tag.green { background: var(--success-light); color: var(--success); }
.pm-page .tag.red { background: var(--danger-light); color: var(--danger); }
.pm-page .tag.orange { background: var(--warning-light); color: var(--warning); }
.pm-page .tags-wrap { display: flex; flex-wrap: wrap; align-items: center; }

/* ---------- 分页 ---------- */
.pm-page .pagination { display: flex; align-items: center; gap: 6px; padding: 14px 0 4px; justify-content: flex-end; }
.pm-page .pagination .total { color: var(--text-3); margin-right: auto; }

.pm-page .pagination .pg {
  min-width: 30px;
  height: 30px;
  padding: 0 6px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text-2);
}

.pm-page .pagination .pg:hover { border-color: var(--primary); color: var(--primary); }
.pm-page .pagination .pg.active { background: var(--primary); border-color: var(--primary); color: #fff; }

/* ---------- 弹窗 ---------- */
.pm-page .mask {
  position: fixed;
  inset: 0;
  background: rgba(29, 33, 41, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.pm-page .modal {
  background: #fff;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  width: 480px;
  max-height: 86vh;
  display: flex;
  flex-direction: column;
}

.pm-page .modal.md { width: 640px; }
.pm-page .modal.lg { width: 820px; }
.pm-page .modal.xl { width: 1080px; max-width: 94vw; }
/* 加大一档：实时监控图表等大图表弹窗 */
.pm-page .modal.xxl { width: 1360px; max-width: 96vw; max-height: 92vh; }
.pm-page .modal-head { padding: 18px 20px; display: flex; align-items: center; border-bottom: 1px solid var(--border-2); }
.pm-page .modal-head .m-title { font-size: 16px; font-weight: 600; }
.pm-page .modal-head .m-sub { font-size: 12px; color: var(--text-3); margin-top: 3px; }
.pm-page .modal-head .x { margin-left: auto; cursor: pointer; color: var(--text-3); display: flex; padding: 2px; }
.pm-page .modal-head .x:hover { color: var(--text-1); }
.pm-page .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
.pm-page .modal-foot { padding: 14px 20px; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--border-2); }

/* 抽屉 */
.pm-page .drawer-mask { position: fixed; inset: 0; background: rgba(29, 33, 41, 0.4); z-index: 1000; }

.pm-page .drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: 760px;
  background: #fff;
  box-shadow: var(--shadow-lg);
  z-index: 1001;
  display: flex;
  flex-direction: column;
}

.pm-page .drawer-head { padding: 18px 20px; display: flex; align-items: center; border-bottom: 1px solid var(--border-2); }
.pm-page .drawer-head .d-title { font-size: 16px; font-weight: 600; }
.pm-page .drawer-head .x { margin-left: auto; cursor: pointer; color: var(--text-3); display: flex; }
.pm-page .drawer-head .x:hover { color: var(--text-1); }
.pm-page .drawer-body { flex: 1; overflow-y: auto; padding: 20px; }
.pm-page .drawer-foot { padding: 14px 20px; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--border-2); }

/* 穿梭选择（选部门） */
.pm-page .transfer { display: flex; gap: 16px; height: 340px; }

.pm-page .transfer .side {
  flex: 1;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.pm-page .transfer .side .s-head {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border-2);
  font-size: var(--fs-base);
  color: var(--text-2);
  display: flex;
  align-items: center;
}

.pm-page .transfer .side .s-head .clear { margin-left: auto; color: var(--primary); cursor: pointer; font-size: 12px; }
.pm-page .transfer .side .s-body { flex: 1; overflow-y: auto; padding: 8px; }

.pm-page .selected-item { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: var(--radius); }
.pm-page .selected-item:hover { background: var(--fill-1); }

.pm-page .selected-item .av {
  width: 24px;
  height: 24px;
  border-radius: 4px;
  background: var(--primary-light);
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  flex-shrink: 0;
}

.pm-page .selected-item .rm { margin-left: auto; cursor: pointer; color: var(--text-4); display: flex; }
.pm-page .selected-item .rm:hover { color: var(--danger); }

/* 分配成员（图一：左侧部门树 + 右侧已选 + 运营归属） */
.pm-page .member-transfer { display: flex; height: 520px; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.pm-page .member-transfer-left { width: 55%; display: flex; flex-direction: column; border-right: 1px solid var(--border-2); background: #fff; }
.pm-page .member-transfer-right { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #fff; }

.pm-page .member-transfer .mtr-head {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border-2);
  font-size: var(--fs-base);
  color: var(--text-2);
  flex-shrink: 0;
}

.pm-page .member-transfer-left .mtr-head { padding: 10px 14px; }
.pm-page .member-transfer-left .mtr-head .input-icon { flex: 1; }
.pm-page .member-transfer-left .mtr-head .input-icon input { width: 100%; }

.pm-page .mtr-breadcrumb {
  padding: 8px 14px;
  font-size: 12px;
  color: var(--text-3);
  border-bottom: 1px solid var(--border-2);
  flex-shrink: 0;
}
.pm-page .mtr-breadcrumb .seg { cursor: pointer; }
.pm-page .mtr-breadcrumb .seg:hover { color: var(--primary); }

/* toast */
/* ---------- 全局标准提示：白底横幅 banner（App.vue 统一挂载，四型场景区分） ----------
   白底圆角卡片 + 彩色圆标图标区分场景：success=绿勾 / error=红叉红字 / warning=橙叹号 / info=蓝 i */
.toast-wrap {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  max-width: calc(100vw - 48px);
  z-index: 3000;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  pointer-events: none;
}

.toast {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  max-width: 560px;
  padding: 12px 18px;
  background: #fff;
  border: 1px solid #eef1f6;
  border-radius: 10px;
  box-shadow: 0 8px 24px rgba(26, 34, 56, 0.12);
  font-size: 14px;
  line-height: 1.6;
  color: #333;
  animation: pmToastIn .25s ease;
  pointer-events: auto;
}

.toast .ic { flex: none; display: flex; margin-top: 2px; }
.toast .msg { flex: 1; min-width: 0; word-break: break-all; }

.toast.success .ic { color: #1fa254; }

.toast.error { color: #d93025; }
.toast.error .ic { color: #d93025; }

.toast.warning .ic { color: #f6bd16; }

.toast.info .ic { color: #1677d4; }

@keyframes pmToastIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

.pm-page .mp-dept .d-ic { width: 30px; height: 30px; border-radius: 6px; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.pm-page .mp-dept .d-col { flex: 1; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
.pm-page .mp-dept .d-col .d-name { font-size: var(--fs-base); color: var(--text-1); }
.pm-page .mp-dept .d-col .d-cnt { font-size: 12px; color: var(--text-3); }
.pm-page .pk-tag .ava-sm { width: 20px; height: 20px; border-radius: 4px; color: #fff; font-size: 11px; display: flex; align-items: center; justify-content: center; }

/* =========================================================
   运营组管理页（og-*）
   ========================================================= */
/* 左侧组列表人数角标 */
.pm-page .og-count { margin-left: auto; font-size: 12px; color: var(--text-3); background: var(--fill-2); border-radius: 999px; padding: 2px 8px; flex-shrink: 0; }

/* 表格单元格：头像 + 层级缩进 */

.pm-page .og-ava { width: 26px; height: 26px; border-radius: 6px; color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.pm-page .og-branch { color: var(--text-4); font-size: 12px; }

/* 角色标签（职级配色） */
.pm-page .og-role-tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: var(--radius-sm); font-size: 12px; white-space: nowrap; }

/* 操作列「更多」图标 */

.pm-page .op .og-more-btn:hover { color: var(--text-1); background: var(--fill-2); opacity: 1; }

/* 添加弹窗：角色 / 挂靠上级信息条 */
.pm-page .og-meta { display: flex; align-items: center; gap: 28px; background: var(--fill-1); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; flex-wrap: wrap; }
.pm-page .og-meta-item { display: flex; align-items: center; gap: 10px; font-size: var(--fs-base); }
.pm-page .og-meta-item .k { color: var(--text-3); flex-shrink: 0; }
.pm-page .og-meta-item .v { color: var(--text-1); font-weight: 500; }

/* 成员选择器：部门树 + 成员列表 */
.pm-page .og-pick { display: flex; height: 380px; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.pm-page .og-pick-tree { width: 240px; border-right: 1px solid var(--border-2); overflow-y: auto; padding: 8px 6px; flex-shrink: 0; background: var(--fill-1); }
.pm-page .og-pick-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.pm-page .og-pick-head { padding: 8px 12px; border-bottom: 1px solid var(--border-2); }
.pm-page .og-pick-list { flex: 1; overflow-y: auto; padding: 6px 8px; }

.pm-page .og-m-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius); cursor: pointer; }
.pm-page .og-m-row:hover { background: var(--fill-1); }
.pm-page .og-m-row.picked { background: var(--primary-light-2); }
.pm-page .og-m-row.disabled { cursor: not-allowed; }
.pm-page .og-m-row.disabled .og-m-info, .pm-page .og-m-row.disabled .og-ava { opacity: .5; }
.pm-page .og-m-row .og-m-info { flex: 1; min-width: 0; }
.pm-page .og-m-row .nm { font-size: var(--fs-base); color: var(--text-1); font-weight: 500; }
.pm-page .og-m-row .dp { font-size: 12px; color: var(--text-3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pm-page .og-m-row .tag { margin: 0; flex-shrink: 0; }

/* 单选圆点 */
.pm-page .og-rad { width: 16px; height: 16px; border: 1px solid var(--border); border-radius: 50%; flex-shrink: 0; transition: all .15s; }
.pm-page .og-m-row:hover .og-rad { border-color: var(--primary); }
.pm-page .og-rad.on { border: 5px solid var(--primary); }
.pm-page .og-m-row.disabled:hover .og-rad { border-color: var(--border); }
.pm-page .og-m-row.disabled .og-rad.on { border-color: var(--primary); }

/* 文字链接按钮（组操作 / 行操作） */
.pm-page .text-link {
  border: none;
  background: none;
  padding: 4px 8px;
  border-radius: 6px;
  font-size: var(--fs-base);
  color: var(--primary);
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.pm-page .text-link:hover { background: var(--primary-light-2); }
.pm-page .text-link.danger { color: var(--danger); }
.pm-page .text-link.danger:hover { background: var(--danger-light); }

/* 运营组管理：工具条 + 分组卡片 */
.pm-page .og-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.pm-page .og-tabs { display: inline-flex; align-items: center; background: #eef1f6; border-radius: 10px; padding: 3px; }
.pm-page .og-tab { height: 32px; padding: 0 20px; border: none; border-radius: 8px; background: transparent; color: var(--text-2); font-size: var(--fs-base); cursor: pointer; transition: all .15s; }
.pm-page .og-tab:hover { color: var(--text-1); }
.pm-page .og-tab.active { background: #fff; color: var(--primary); font-weight: 600; box-shadow: 0 1px 4px rgba(26, 34, 56, .08); }
.pm-page .og-tools { display: flex; align-items: center; gap: 8px; }
.pm-page .og-search { width: 260px; flex: none; }
.pm-page .og-g-name { font-size: 14px; font-weight: 600; color: var(--text-1); flex: 1; min-width: 120px; overflow: hidden; text-overflow: ellipsis; }
.pm-page .og-lead-ava { width: 18px; height: 18px; border-radius: 50%; color: #fff; font-size: 10px; display: inline-flex; align-items: center; justify-content: center; }
.pm-page .og-g-count { font-size: 12px; color: var(--text-3); background: var(--fill-2); border-radius: 999px; padding: 2px 9px; flex-shrink: 0; }
.pm-page .og-g-time { font-size: 12px; color: var(--text-4); flex-shrink: 0; }
.pm-page .og-group-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }

/* 运营组管理：整块统一背景（消除割裂感）+ 左右主从 */
.pm-page .og-wrap { background: var(--white); border: 1px solid var(--border-2); border-radius: 12px; padding: 14px 16px 16px; display: flex; flex-direction: column; flex: 1; min-height: 0; }
.pm-page .og-md { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; align-items: stretch; flex: 1; min-height: 0; }
.pm-page .og-md-left { display: flex; flex-direction: column; gap: 6px; border-right: 1px solid var(--border-2); padding-right: 16px; }
.pm-page .og-md-item { border: 1px solid transparent; border-radius: 10px; padding: 10px 12px; cursor: pointer; transition: background .15s; }
.pm-page .og-md-item:hover { background: var(--fill-1); }
.pm-page .og-md-item.active { background: var(--primary-light-2); border-color: var(--primary); }
.pm-page .og-md-item-hd { display: flex; align-items: center; gap: 8px; }
.pm-page .og-md-more { opacity: 0; display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 6px; color: var(--text-3); flex-shrink: 0; transition: opacity .15s; }
.pm-page .og-md-item:hover .og-md-more, .pm-page .og-md-item.active .og-md-more { opacity: 1; }
.pm-page .og-md-more:hover { background: var(--fill-2); color: var(--text-1); }
.pm-page .og-md-name { flex: 1; font-size: var(--fs-base); font-weight: 600; color: var(--text-1); overflow: hidden; text-overflow: ellipsis; }
.pm-page .og-md-item-sub { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--text-3); }
.pm-page .og-md-right { min-height: 420px; }
.pm-page .og-detail-hd { display: flex; align-items: center; gap: 12px; padding: 2px 0 12px; border-bottom: 1px solid var(--border-2); }
.pm-page .og-detail-body { padding-top: 12px; }

/* 成员表格列表（结构参考品控中心编码列表） */
.pm-page .og-tr { display: grid; grid-template-columns: minmax(200px, 1.5fr) minmax(90px, .8fr) minmax(150px, 1.2fr) minmax(90px, .8fr) minmax(110px, 1fr); gap: 8px; align-items: center; padding: 0 12px; min-height: 50px; border-bottom: 1px solid var(--border-2); }
.pm-page .og-tr.head { min-height: 40px; background: #f5f7fa; border-radius: 8px 8px 0 0; font-size: 12px; color: var(--text-3); padding: 0 12px; /* 显式重置，防 .ops-center .head 泛选择器污染导致表头与内容列错位 */ }
.pm-page .og-tr.spec { cursor: pointer; user-select: none; }
.pm-page .og-tr:not(.head):hover { background: #f7faff; }
.pm-page .og-tr.sub { background: #fafbfd; }
.pm-page .og-cell { font-size: var(--fs-base); color: var(--text-1); min-width: 0; }
.pm-page .og-td-name { display: flex; align-items: center; gap: 8px; }
.pm-page .og-td-name.d1 { padding-left: 24px; }
.pm-page .og-td-name.d2 { padding-left: 48px; }
.pm-page .og-cell-nm { font-weight: 600; color: var(--text-1); overflow: hidden; text-overflow: ellipsis; }
.pm-page .og-td-name .arrow { display: inline-flex; width: 16px; height: 16px; align-items: center; justify-content: center; color: var(--text-3); transition: transform .15s; flex-shrink: 0; }
.pm-page .og-td-name .arrow.open { transform: rotate(90deg); }
.pm-page .og-td-name .arrow.leaf { visibility: hidden; }
.pm-page .og-td-dim { color: var(--text-3); font-size: 12px; }
.pm-page .og-tr-empty { padding: 18px 12px; font-size: 12px; color: var(--text-4); border-bottom: 1px solid var(--border-2); }
/* 操作列竖排：直出最多两个 + 更多气泡 */
.pm-page .og-act-stack { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 4px 0; }
.pm-page .og-act-stack .text-link { padding: 2px 0; }
.pm-page .og-act-stack a { color: var(--primary); font-size: var(--fs-base); text-decoration: none; padding: 2px 0; border-radius: 6px; }
.pm-page .og-act-stack a:hover { background: var(--primary-light-2); }
.pm-page .og-ava.sm { width: 22px; height: 22px; font-size: 11px; border-radius: 5px; }

/* 运营归属展示 */
.pm-page .og-assign-cell { display: flex; flex-direction: column; gap: 4px; }
.pm-page .og-assign-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.pm-page .og-assign-channel { color: var(--text-2); min-width: 42px; }
.pm-page .og-assign-group { color: var(--text-1); font-weight: 500; }
.pm-page .og-assign-role { color: var(--text-3); }

/* 添加成员：运营归属绑定（平台 tab · 必选） */
.pm-page .og-binding-step { display: flex; flex-direction: column; gap: 12px; }
.pm-page .og-bind-head { display: flex; align-items: center; }
.pm-page .og-bind-tabs { align-self: flex-start; }
.pm-page .og-bind-panel { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; background: var(--white); }
.pm-page .og-binding-sum { margin-left: auto; font-size: 12px; color: var(--primary); background: var(--primary-light-2); border-radius: 999px; padding: 3px 10px; }
.pm-page .og-bind-tip { font-size: 12px; color: var(--text-3); background: var(--fill-1); border-radius: 8px; padding: 8px 10px; }
.pm-page .og-bind-hint { font-size: 12px; color: var(--text-3); margin-top: 6px; }
.pm-page .og-bind-hint.warn { color: var(--danger); }
.pm-page .og-bind-field > label { display: block; font-size: 12px; color: var(--text-3); margin-bottom: 6px; }
.pm-page .og-role-pills { display: flex; gap: 8px; }
.pm-page .og-pill { height: 30px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--white); color: var(--text-2); font-size: 12px; cursor: pointer; transition: all .15s; }
.pm-page .og-pill:hover { border-color: var(--primary); color: var(--primary); }
.pm-page .og-pill.on { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
.pm-page .og-pill-n { font-style: normal; margin-left: 6px; border-radius: 999px; padding: 0 6px; background: var(--fill-1); color: var(--text-3); }
.pm-page .og-pill.on .og-pill-n { background: rgba(255, 255, 255, .28); color: #fff; }
.pm-page .og-bind-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
/* 编辑归属弹窗：分段 tab 与下方表单左对齐 */
.pm-page .og-edit-tabs { margin: 0 0 16px; }
/* 气泡下拉复用 .input 盒样式：打开态描边与输入框 focus 一致 */
.pm-page .bselect.input.open { border-color: var(--primary); }

/* 分配成员向导 · 第二步 */
.pm-page .am-step2 { height: 520px; overflow-y: auto; padding-right: 6px; }
.pm-page .am-step2-sum { display: flex; align-items: flex-start; gap: 10px; background: var(--fill-1); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 16px; }
.pm-page .am-sum-label { font-size: 12px; color: var(--text-3); flex-shrink: 0; padding-top: 5px; }
.pm-page .am-sum-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.pm-page .am-sum-tag { display: inline-flex; align-items: center; gap: 6px; background: var(--white); border: 1px solid var(--border-2); border-radius: 999px; padding: 3px 12px 3px 4px; font-size: 12px; color: var(--text-1); }
/* 步骤2：职位下选人（组长单选 / 专员·助理多选） */
.pm-page .am-pick-list { display: flex; flex-wrap: wrap; gap: 8px; }
.pm-page .am-pick { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--white); border-radius: 8px; padding: 5px 10px; font-size: 12px; color: var(--text-2); cursor: pointer; transition: all .15s; }
.pm-page .am-pick:hover { border-color: var(--primary); color: var(--primary); }
.pm-page .am-pick.on { border-color: var(--primary); background: #eef4ff; color: var(--primary); }
.pm-page .am-pick .ck { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; border-radius: 50%; background: var(--primary); color: #fff; }
.pm-page .am-pick .as { font-style: normal; font-size: 11px; color: var(--text-4); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; }
.pm-page .am-sum-tag .og-ava { width: 20px; height: 20px; border-radius: 50%; font-size: 11px; }

/* 右侧占位 */
.pm-page .og-empty-side .empty { padding-top: 80px; }

/* =========================================================
   收敛共享类（原散落于模板的行内样式，统一收敛于此；规范见《UI&风格设计规范文档》）
   ========================================================= */
/* 布局小工具 */
.pm-page .grow { flex: 1; }
.pm-page .ml-auto { margin-left: auto; }
.pm-page .mt0 { margin: 0; }
/* 表格：次级信息列 / 空值占位 / 操作列表头宽度 */
.pm-page .td-time { color: var(--text-3); }
.pm-page .td-dim { color: var(--text-4); }
.pm-page .th-op { width: 80px; }
.pm-page .th-150 { width: 150px; }
.pm-page .th-14 { width: 14%; }
.pm-page .th-24 { width: 24%; }
/* 空状态尺寸变体（默认 60px，嵌入面板用紧凑档） */
.pm-page .empty.tight { padding: 20px 0; }
.pm-page .empty.md { padding: 30px 0; }
/* 表单提示间距变体 */
.pm-page .form-tip.mt { margin-top: 10px; }
.pm-page .form-tip.mb { margin-bottom: 14px; }
/* 弹窗内警示说明（图标 + 文案） */
.pm-page .modal-warn { display: flex; gap: 12px; align-items: flex-start; }
.pm-page .modal-warn-ic { flex-shrink: 0; color: var(--warning); }
.pm-page .modal-warn-ic.danger { color: var(--danger); }
.pm-page .modal-warn-txt { color: var(--text-2); line-height: 1.6; padding-top: 1px; }
/* 表单横排（双列 / 输入+按钮） */
.pm-page .form-row { display: flex; gap: 16px; }
.pm-page .form-row-sm { display: flex; gap: 8px; }
.pm-page .input-ro { background: var(--fill-1); }
/* 角色选择器（RoleSelector） */
.pm-page .rs-group { margin-bottom: 14px; }
.pm-page .rs-group-name { font-size: 12px; color: var(--text-3); margin-bottom: 8px; }
.pm-page .rs-list { display: flex; flex-wrap: wrap; gap: 8px; }
.pm-page .rs-item { border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }
/* 部门转移穿梭框 */
.pm-page .dt-count { margin: 0 3px; color: var(--primary); }
.pm-page .dt-empty { padding: 24px 0; text-align: center; color: var(--text-4); }
.pm-page .dt-label { margin-left: 6px; }
.pm-page .dt-desc { color: var(--text-4); font-size: 12px; margin-left: auto; }

/* =========================================================
   店铺管理（权限设置 › 店铺列表）：复用 ops-center 的 sg / ib 族样式，此处仅补单元格级样式
   ========================================================= */
/* ID信息双行单元格（账号ID / 店铺ID） */
.smg-idcell { display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-base); color: var(--color-text-2); white-space: nowrap; }
/* 店铺信息：平台图标（28px 圆角）+ 店铺名 / 登录账号副行 */
.smg-shop { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ops-center .smg-shop .store-logo { width: 28px; height: 28px; border-radius: 8px; flex: none; }
.smg-shop-info { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.smg-shop-name { font-size: var(--fs-base); font-weight: 600; color: var(--color-text); }
.smg-shop-login { font-size: 12px; color: var(--color-text-3); }
/* 空值占位破折号 */
.smg-dash { color: var(--color-text-3); }
/* 可用成员单元格：≤2 人逐人「头像+姓名」对；>2 人叠放头像组（后枚压前枚）+ 等N人文案 */
.smg-members { display: flex; align-items: center; gap: 12px; min-width: 0; }
.smg-mpair { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.smg-mname { font-size: var(--fs-base); color: var(--color-text-2); white-space: nowrap; }
.smg-avas { display: inline-flex; flex: none; }
.smg-ava { width: 28px; height: 28px; border-radius: 50%; color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid #fff; flex-shrink: 0; }
.smg-ava + .smg-ava { margin-left: -10px; }
.smg-member-text { font-size: var(--fs-base); color: var(--color-text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* 两层展开（品控监控列表样式）：灰底展开行内嵌白底账号子表；店铺行首列箭头＋勾选垂直居中 */
.smg-table .ib-expand-row > td { background: #f7f8fa; padding: 12px 16px; }
/* 主表固定布局：数据列不写宽度等分剩余宽（auto 布局店铺信息列会吞噬余宽致列宽悬殊） */
.smg-table { table-layout: fixed; }
/* 账号子表固定布局：列宽由 th 百分比决定，多个展开子表列位逐一对齐（auto 宽会随内容长短漂移错位） */
.smg-table .ib-subtable { table-layout: fixed; }
/* 主表首列（箭头＋勾选）垂直居中：仅限主表直属行单元格（直接子选择器），
   防后代选择器泄漏到嵌套账号子表首列（约定：列表字段一律顶部对齐） */
.smg-table > tbody > tr > td:first-child { vertical-align: middle; white-space: nowrap; }

/* 右侧抽屉（管理账号 / 分组管理 / 发布设置）：遮罩点击与 ESC 均可关 */
.smg-drawer-mask { position: fixed; inset: 0; background: rgba(31, 35, 41, 0.45); z-index: 1200; display: flex; justify-content: flex-end; }
.smg-drawer { width: 480px; max-width: 94vw; height: 100%; background: #fff; display: flex; flex-direction: column; box-shadow: -8px 0 40px rgba(31, 35, 41, 0.16); animation: smg-drawer-in 0.2s ease; }
@keyframes smg-drawer-in {
  from { transform: translateX(40px); opacity: 0.4; }
  to { transform: translateX(0); opacity: 1; }
}
.smg-dr-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--color-border-2); }
.smg-dr-title { font-size: 15px; font-weight: 600; color: var(--color-text); }
.smg-dr-x { display: inline-flex; padding: 4px; border: none; background: transparent; border-radius: 6px; color: var(--color-text-3); cursor: pointer; }
.smg-dr-x:hover { background: var(--color-fill-2); color: var(--color-text); }
.smg-dr-body { flex: 1; min-height: 0; overflow-y: auto; padding: 20px; }
.smg-dr-field { margin-bottom: 20px; }
.smg-dr-label { display: flex; align-items: center; font-size: var(--fs-base); color: var(--color-text-2); margin-bottom: 8px; }
.smg-req { font-style: normal; color: var(--color-danger); margin-right: 4px; }
.smg-dr-input { width: 100%; height: 36px; border: 1px solid var(--color-border); border-radius: 8px; padding: 0 12px; font-size: var(--fs-base); color: var(--color-text); background: #fff; }
.smg-dr-input:disabled { border-color: transparent; background: var(--color-fill-2); color: var(--color-text-3); cursor: not-allowed; }
.smg-dr-grow { display: flex; align-items: center; gap: 8px; }
.ops-center .smg-dr-grow .sg-select { flex: 1; min-width: 0; width: auto; }
.smg-dr-gear { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex: none; border: none; background: transparent; border-radius: 8px; color: var(--color-primary); cursor: pointer; }
.smg-dr-gear:hover { background: var(--color-fill-2); }
.smg-dr-mhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.smg-dr-mtitle { font-size: var(--fs-base); color: var(--color-text-2); }
.ops-center .smg-dr-add { display: inline-flex; align-items: center; gap: 4px; border: none; background: transparent; padding: 0; color: var(--color-primary); font-size: var(--fs-base); cursor: pointer; }
.ops-center .smg-dr-add:hover { text-decoration: underline; }
.smg-dr-mbox { border: 1px dashed var(--color-border); border-radius: 10px; padding: 4px 12px; min-height: 76px; display: flex; flex-direction: column; justify-content: center; }
.smg-dr-mempty { text-align: center; color: var(--color-text-3); font-size: var(--fs-base); padding: 20px 0; }
.smg-dr-mrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: var(--fs-base); color: var(--color-text); }
.smg-dr-mrow .smg-ava { width: 32px; height: 32px; font-size: var(--fs-base); }
.smg-dr-mname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ops-center .smg-dr-mrm { border: none; background: transparent; padding: 0; color: var(--color-danger); font-size: var(--fs-base); cursor: pointer; }
.ops-center .smg-dr-mrm:hover { text-decoration: underline; }
.smg-dr-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--color-border-2); }

/* 抽屉之上的弹窗宿主（添加成员 / 分组清单）：层级高于抽屉遮罩 */
.smg-top-host { position: relative; z-index: 1250; }

/* 分组清单弹窗：分组行（默认项标「默认」）+ 添加分组 */
.smg-gp-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--color-fill-2); border-radius: 8px; padding: 9px 14px; margin-bottom: 8px; font-size: var(--fs-base); color: var(--color-text); }
.smg-gp-def { color: var(--color-text-3); font-size: 12px; }
.ops-center .smg-gp-rm { border: none; background: transparent; padding: 0; color: var(--color-danger); font-size: var(--fs-base); cursor: pointer; }
.ops-center .smg-gp-rm:hover { text-decoration: underline; }
.smg-gp-input { flex: 1; height: 30px; border: 1px solid var(--color-border); border-radius: 6px; padding: 0 10px; font-size: var(--fs-base); color: var(--color-text); background: #fff; }
.ops-center .smg-gp-add { display: inline-flex; align-items: center; gap: 4px; border: none; background: transparent; padding: 4px 0; color: var(--color-primary); font-size: var(--fs-base); cursor: pointer; }

/* ---------- 账号管理：添加买家账号主按钮 + 平台气泡菜单（官方图标，点选直达） ---------- */
.am-addwrap { position: relative; display: inline-flex; }

/* 主按钮：加号 + 文案 + 展开箭头（展开时箭头翻转） */
.ops-center .am-addbtn { display: inline-flex; align-items: center; gap: 6px; transition: background 0.15s, border-color 0.15s; }

.ops-center .am-addbtn:hover { background: var(--color-primary-hover); border-color: var(--color-primary-hover); }

.am-addbtn-arrow { transition: transform 0.15s; }

.am-addwrap.open .am-addbtn-arrow { transform: rotate(180deg); }

/* 平台气泡菜单：白卡 + 弹层阴影，入场轻动画 */
.am-addmenu {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 30;
  min-width: 172px;
  padding: 6px;
  background: #fff;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  animation: am-addmenu-in 0.15s ease-out;
}

@keyframes am-addmenu-in {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: none; }
}

.ops-center .am-addmenu-item {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 7px 8px;
  border: none;
  background: transparent;
  border-radius: var(--radius-sm);
  font: inherit;
  font-size: var(--fs-base);
  color: var(--color-text);
  text-align: left;
  cursor: pointer;
  transition: background 0.15s;
}

.ops-center .am-addmenu-item:hover { background: var(--color-fill-2); }

.ops-center .am-addmenu-item:hover .am-addmenu-go { opacity: 1; color: var(--color-primary); }

/* 平台官方图标；无资产平台用品牌色字标兜底 */
.am-addmenu-logo {
  flex: none;
  width: 20px;
  height: 20px;
  border-radius: var(--radius-xs);
  object-fit: cover;
  background: var(--color-fill-2);
}

.am-addmenu-word {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 9px;
  font-weight: 600;
  line-height: 1;
}

.am-addmenu-name { flex: 1; min-width: 0; }

/* 行尾导向箭头：默认隐藏，hover 显现提示可直达 */
.am-addmenu-go {
  flex: none;
  opacity: 0;
  color: var(--color-text-3);
  transition: opacity 0.15s, color 0.15s;
}
.ops-center .smg-gp-add:hover { text-decoration: underline; }

/* =========================================================
   设置 › 数据导入：新建上传弹窗文件选择区与列表文件单元格
   ========================================================= */
.ops-center .di-form { display: flex; flex-direction: column; gap: 16px; }

.ops-center .di-field > label { display: block; margin-bottom: 6px; font-size: var(--fs-aux); color: var(--color-text-3); }

.ops-center .di-field .bselect { width: 100%; }

.ops-center .di-val { font-size: var(--fs-base); color: var(--color-text); }

/* 文件选择区：虚线框提示可点选；选中后实线 + 文件名回显 */
.ops-center .di-filezone {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 76px;
  padding: 0 16px;
  border: 1px dashed var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-fill);
  color: var(--color-text-3);
  font-size: var(--fs-base);
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}

.ops-center .di-filezone:hover { border-color: var(--color-primary); color: var(--color-primary); }

.ops-center .di-filezone.on { border-style: solid; border-color: var(--color-primary); background: #fff; color: var(--color-text); }

.ops-center .di-filename { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.ops-center .di-filesite { flex: none; font-size: var(--fs-aux); color: var(--color-text-3); }

/* 列表文件单元格：文件名 + 大小副行 */
.ops-center .di-filecell { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

.ops-center .di-filecell .name { font-size: var(--fs-base); color: var(--color-text); }

.ops-center .di-filecell .size { font-size: var(--fs-aux); color: var(--color-text-3); }

/* 列表列宽：五列先等分（各 20%）再按内容占比微调——文件列内容最长加宽、上传人/类型列收窄，固定布局防单列吞噬剩余宽度 */
.ops-center .di-table { table-layout: fixed; }
.ops-center .di-table th:nth-child(1) { width: 18%; }
.ops-center .di-table th:nth-child(2) { width: 34%; }
.ops-center .di-table th:nth-child(3) { width: 14%; }
.ops-center .di-table th:nth-child(4) { width: 16%; }
.ops-center .di-table th:nth-child(5) { width: 18%; }

/* ---------- 店铺配置抽屉：单选 radio 组（对齐 StrategyDrawer 的 st-radios 样式） ---------- */
.smg-radios { display: flex; gap: 24px; }
.smg-radio { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: var(--fs-base); color: var(--color-text); }
.smg-radio input[type="radio"] { accent-color: var(--color-primary); width: 16px; height: 16px; cursor: pointer; }
.smg-radio input[type="radio"]:disabled { cursor: not-allowed; opacity: 0.5; }
.smg-radio span { user-select: none; }
.app-layout {
  display: flex;
  flex-direction: column;
  height: 100%;
}

.app-header {
  display: flex;
  align-items: center;
  height: var(--header-height);
  flex-shrink: 0;
  padding: 0 24px 0 36px;
  background: var(--color-bg-header);
}

.app-logo {
  font-size: 21px;
  font-weight: 600;
  color: #000;
  letter-spacing: 0.5px;
}

/* ≤1440：收紧顶栏内边距，适配 1440 及以下屏幕 */
@media (max-width: 1440px) {
  .app-header {
    padding: 0 20px 0 28px;
  }
}

/* <768 极窄断点：收紧顶栏内边距 */
@media (max-width: 767px) {
  .app-header {
    padding: 0 16px;
  }
}

/* 顶栏右侧：头像 + 用户名 + 窗口控制点 */
.app-header-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}

.app-avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 2px solid #f08c1a;
  background: linear-gradient(135deg, #ffd9a0, #f2a35c);
}

.app-username {
  font-size: 14px;
  color: #333;
}

.app-window-dots {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: 12px;
}

.app-dot {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 14px;
  height: 14px;
  padding: 0;
  border: none;
  border-radius: 50%;
  font-size: 9px;
  line-height: 1;
  color: rgba(0, 0, 0, 0.6);
  cursor: pointer;
}

.app-dot.minimize {
  background: #f5b50a;
}

.app-dot.maximize {
  background: #2ec84e;
}

.app-dot.close {
  background: #f0413a;
}

.app-body {
  display: flex;
  flex: 1;
  overflow: hidden;
}

.app-content {
  flex: 1;
  overflow-y: auto;
  /* 预留滚动条轨道，内容高矮变化时不出现横向抦动 */
  scrollbar-gutter: stable;
  background: var(--color-bg);
}

.app-content.ac-standalone {
  display: flex;
  flex-direction: column;
  padding: 0;
}

/* ============ 全局站内信：铃铛入口 + 下拉面板（与智能运营中心消息通知同一视觉语言） ============ */
.gmsg-bell { position: relative; }

.gmsg-bell-btn {
  position: relative;
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: #fff;
  color: var(--color-text-2);
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}

.gmsg-bell-btn:hover { color: var(--color-primary); border-color: var(--color-primary); }

.gmsg-badge {
  position: absolute;
  top: -6px;
  right: -6px;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 8px;
  background: var(--color-danger);
  color: #fff;
  font-size: 10px;
  line-height: 16px;
  text-align: center;
}

.gmsg-panel {
  position: absolute;
  top: 42px;
  right: 0;
  z-index: 200;
  width: 680px;
  background: #fff;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}

.gmsg-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px 14px;
  font-size: var(--fs-title);
  font-weight: 600;
  color: var(--color-text);
}

.gmsg-head a { font-size: var(--fs-base); font-weight: 400; color: var(--color-primary); cursor: pointer; }

.gmsg-head a.disabled { color: var(--color-text-3); pointer-events: none; }

/* 第一层（来源应用）：文字 tab，大间距，active 加粗深色 */
.gmsg-tabs.l1 { display: flex; gap: 36px; padding: 0 24px 14px; border-bottom: 1px solid var(--color-border-2); }

.gmsg-tabs.l1 span { white-space: nowrap; font-size: var(--fs-lg); color: var(--color-text-2); cursor: pointer; }

.gmsg-tabs.l1 span:hover { color: var(--color-text); }

.gmsg-tabs.l1 span.active { color: var(--color-text); font-weight: 700; }

/* 第二层（消息类别）：圆角 chip 组，active 白底+边框阴影，与第一层拉开层级 */
.gmsg-tabs.l2 { display: flex; flex-wrap: wrap; gap: 12px; padding: 14px 24px 18px; }

.gmsg-tabs.l2 span {
  white-space: nowrap;
  padding: 8px 18px;
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  background: var(--color-fill-2);
  font-size: var(--fs-base);
  color: var(--color-text-2);
  cursor: pointer;
}

.gmsg-tabs.l2 span:hover { color: var(--color-text); }

.gmsg-tabs.l2 span.active { background: #fff; border-color: var(--color-border); color: var(--color-text); font-weight: 600; box-shadow: var(--shadow-sm); }

/* 消息流：灰底 + 白色卡片，疏朗间距 */
.gmsg-list { max-height: 640px; overflow: auto; background: #f5f6f8; padding: 16px 20px; }

/* 掉店提醒操作行：前往按钮右置（直达店铺管理-管理账号抽屉） */
.gmsg-acts { display: flex; justify-content: flex-end; margin-top: 10px; }

.gmsg-go {
  padding: 4px 16px;
  border: 1px solid var(--color-primary);
  border-radius: var(--radius-md);
  background: #fff;
  color: var(--color-primary);
  font-size: var(--fs-aux);
  cursor: pointer;
}

.gmsg-go:hover { background: var(--color-primary-light); }

.gmsg-item {
  background: #fff;
  border-radius: var(--radius-xl);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
}

.gmsg-item:last-child { margin-bottom: 0; }

.gmsg-item:hover { box-shadow: var(--shadow-md); }

/* 卡片首行：应用名 + 时间，灰字 */
.gmsg-meta { display: flex; align-items: center; justify-content: space-between; font-size: var(--fs-base); color: var(--color-text-3); }

/* 卡片标题：加粗黑字 + 未读红点（文字右侧） */
.gmsg-title-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }

.gmsg-dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: transparent; }

.gmsg-item.unread .gmsg-dot { background: var(--color-danger); }

.gmsg-title-row b { font-size: var(--fs-title); font-weight: 700; color: var(--color-text); }

.gmsg-desc { margin-top: 8px; font-size: var(--fs-base); line-height: 1.55; color: var(--color-text-3); }

/* kv 区：一排展示，标签定宽灰字、值深色 */
.gmsg-kvs { display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 14px; }

.gmsg-kv { display: flex; align-items: center; gap: 16px; font-size: var(--fs-base); }

.gmsg-kv .k { flex: none; width: 60px; color: var(--color-text-3); }

.gmsg-kv .v { min-width: 0; color: var(--color-text); }

.gmsg-empty { padding: 48px 0; text-align: center; font-size: var(--fs-base); color: var(--color-text-3); }

/* 离开蜜蜂插件（脏态）二次确认：全局最高层级，盖住插件弹窗与悬浮球 */
.app-confirm {
  position: fixed;
  inset: 0;
  z-index: 1200;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(20, 26, 40, 0.45);
}

.app-confirm-card {
  width: 360px;
  max-width: 92vw;
  padding: 18px 22px 20px;
  background: #fff;
  border-radius: var(--radius-2xl);
  box-shadow: var(--shadow-lg);
  text-align: center;
}

.app-confirm-card b { display: block; font-size: var(--fs-title); color: var(--color-text); }

.app-confirm-card p { margin: 8px 0 16px; font-size: var(--fs-base); line-height: 1.6; color: var(--color-text-2); }

.app-confirm-foot { display: flex; justify-content: flex-end; gap: 10px; }

.app-confirm-foot button {
  padding: 7px 16px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: #fff;
  font-size: var(--fs-base);
  color: var(--color-text-2);
  cursor: pointer;
}

.app-confirm-foot button:hover { color: var(--color-text); border-color: var(--color-text-3); }

.app-confirm-foot button.danger { background: var(--color-danger-light); border-color: transparent; color: var(--color-danger); }

.app-confirm-foot button.danger:hover { background: var(--color-danger); color: #fff; }
/* 全局统一白底气泡下拉（替代原生 select 弹层） */
.bselect {
  position: relative;
  min-width: 0;
}
/* 复用模块 .select 盒样式时，触发器内边距与输入件对齐 */
.bselect.select .bselect-trigger {
  padding: 0 10px;
}
.bselect .bselect-trigger {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: transparent;
  border: none;
  padding: 0;
  margin: 0;
  font: inherit;
  /* 筛选控件字号全局统一，不随页面继承字号漂移 */
  font-size: var(--fs-base);
  color: inherit;
  text-align: left;
  cursor: pointer;
  outline: none;
}
.bselect .bselect-text {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* 功能标题占位（非选择项）灰色展示 */
.bselect .bselect-text.ph {
  color: #98a0b3;
}
.bselect .bselect-arrow {
  flex: none;
  color: #8b92a1;
  transition: transform 0.15s;
}
.bselect.open .bselect-arrow {
  transform: rotate(180deg);
}
.bselect.disabled {
  opacity: 0.55;
  cursor: not-allowed;
}
.bselect.disabled .bselect-trigger {
  cursor: not-allowed;
}

/* 白底气泡菜单（portal 到 body、fixed 定位，不被 overflow 容器裁剪；位置/宽度由组件内联控制） */
.bselect-menu {
  position: fixed;
  overflow-y: auto;
  background: #fff;
  border: 1px solid #e8ebf1;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(26, 34, 56, 0.12);
  padding: 6px;
}
.bselect-opt {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  border-radius: 8px;
  font-size: var(--fs-base);
  color: #445066;
  cursor: pointer;
  white-space: nowrap;
}
.bselect-opt:hover {
  background: #f5f8ff;
}
.bselect-opt.selected {
  color: var(--color-primary);
  font-weight: 500;
}
.bselect-opt.disabled {
  color: #b8bfcc;
  cursor: not-allowed;
}
.bselect-opt.disabled:hover {
  background: transparent;
}
.bselect-check {
  width: 14px;
  flex: none;
  font-size: 12px;
}
.bselect-label {
  overflow: hidden;
  text-overflow: ellipsis;
}
/* 彩色枚举图标（星星/旗帜）：内联 SVG，fill 跟随选项颜色 */
.bselect-icon { flex: none; }
.bselect-text .bselect-icon { display: inline-block; vertical-align: -2px; margin-right: 4px; }
/* 搜索框（searchable 菜单顶部） */
.bselect-search { padding: 2px 2px 6px; }
.bselect-search input {
  width: 100%;
  height: 30px;
  border: 1px solid #e8ebf1;
  border-radius: 8px;
  padding: 0 10px;
  font-size: 12px;
  color: #33415e;
  background: #f7f9fc;
  outline: none;
}
.bselect-search input:focus { border-color: var(--color-primary); background: #fff; }
.bselect-empty { padding: 10px 12px; font-size: 12px; color: #98a0b3; }
/* 新建候选（creatable）：搜索输入未命中时列表底部一行「＋ 新建「xx」」，点选即创建 */
.bselect-create {
  display: flex; align-items: center; gap: 6px;
  margin-top: 4px; padding: 8px 12px; border-top: 1px solid #f0f3f7; border-radius: 0 0 8px 8px;
  font-size: var(--fs-base); color: var(--color-primary); cursor: pointer; white-space: nowrap;
}
.bselect-create:hover { background: #f5f8ff; }
.bselect-create-plus { font-size: 12px; line-height: 1; }
/* 修改已有类型（renamable）：选项 hover 尾部铅笔；点击切换行内输入行（回车/确认提交，Esc 取消） */
.bselect-rename {
  margin-left: auto; display: none; align-items: center;
  padding: 2px 4px; border-radius: 6px; color: #8b92a1; cursor: pointer;
}
.bselect-opt:hover .bselect-rename { display: flex; }
.bselect-rename:hover { color: var(--color-primary); background: #eef3ff; }
.bselect-rename-form { display: flex; gap: 6px; width: 100%; }
.bselect-rename-form input {
  flex: 1; min-width: 0; height: 26px; padding: 0 8px;
  border: 1px solid #e8ebf1; border-radius: 6px;
  font-size: 12px; color: #33415e; background: #fff; outline: none;
}
.bselect-rename-form input:focus { border-color: var(--color-primary); }
.bselect-rename-form button {
  flex: none; height: 26px; padding: 0 10px; border: none; border-radius: 6px;
  background: var(--color-primary); color: #fff; font-size: 12px; cursor: pointer;
}
.bselect-rename-form button:hover { background: var(--color-primary-hover); }
/* 可删除选项：hover 尾部垃圾桶（与改名铅笔同款显隐逻辑；两者同现时铅笔负责右推） */
.bselect-del {
  margin-left: auto; display: none; align-items: center;
  padding: 2px 4px; border-radius: 6px; color: #8b92a1; cursor: pointer;
}
.bselect-rename ~ .bselect-del { margin-left: 0; }
.bselect-opt:hover .bselect-del { display: flex; }
.bselect-del:hover { color: #e5484d; background: #fdecec; }
/* ============ MoreActions 触发器样式（气泡 .add-pop 见 OpsCenter.css 全局） ============ */
/* 三个点触发器：表格操作列收口入口，24px 圆角浅底 hover */
.more-dot {
  display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; border-radius: var(--radius-sm);
  color: var(--color-text-3); cursor: pointer; line-height: 0;
  transition: background 0.15s, color 0.15s;
}
.more-dot:hover { background: var(--color-fill-2); color: var(--color-text); }
/* 级联选择菜单：搜索行 + 左列分组 / 右列具体选项（触发器样式复用 BubbleSelect.css 的 .bselect）
   宽度随内容收缩（不铺满触发器，无右列时不留空白区）；左缘对齐触发器 */
.casc-menu {
  display: flex;
  flex-direction: column;
  width: max-content;
  max-width: calc(100vw - 16px);
  background: #fff;
  border: 1px solid #e6e9f0;
  border-radius: 10px;
  box-shadow: 0 8px 24px rgba(24, 39, 75, 0.12);
  overflow: hidden;
}

/* 搜索框行（复用 .bselect-search 视觉）：与列区留出内边距 */
.casc-search { padding: 8px 8px 6px; }

/* 两列容器：搜索行之下横向排布 */
.casc-cols { display: flex; min-height: 0; }

/* 左列撑满菜单宽（与搜索框左右缘对齐，不留空白区）；右列按内容宽 */
.casc-col {
  flex: 1 1 auto;
  min-width: 128px;
  max-height: 272px;
  overflow: auto;
  padding: 6px 8px 8px;
}

.casc-col.right {
  flex: 0 0 auto;
  min-width: 168px;
  border-left: 1px solid #eef1f6;
}

.casc-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 10px;
  border-radius: 8px;
  font-size: var(--fs-base);
  color: #303948;
  cursor: pointer;
  white-space: nowrap;
}

.casc-item:hover { background: #f2f5fa; }
.casc-item.selected { color: #4f7cff; font-weight: 600; }
.casc-item.group { justify-content: space-between; }
.casc-item.group.active { background: #f2f5fa; color: #4f7cff; font-weight: 600; }

.casc-check {
  width: 12px;
  flex: none;
  font-size: 12px;
  color: #4f7cff;
}

.casc-arrow {
  font-style: normal;
  font-size: 10px;
  color: #b3bac6;
}

/* 多选模式：✓ 前缀 + 主色加粗（与全局下拉选中态一致，不用勾选框）；组名占满剩余宽保持箭头靠右 */
.casc-gname { flex: 1; }
.casc-item.checked { color: #4f7cff; font-weight: 600; }
/* 组行部分选中：主色常规字重 + ✓ 半透明，与整组选全区分 */
.casc-item.partial { color: #4f7cff; }
.casc-check.partial { opacity: .45; }

.sort-th { cursor: pointer; user-select: none; white-space: nowrap;
}
.sort-th:hover { color: var(--color-primary);
}
.sort-th-in { display: inline-flex; align-items: center; gap: 4px;
}
.sort-th-ico { flex: none; display: block;
}
/* =========================================================
   Funion 品控管理 v2（独立模块，作用域 .qc-page，基础件复用 .pm-page）
   视觉语言沿用智能运营中心：#4f7cff 主色 / 16px 圆角白卡 / 13px 表格字号
   ========================================================= */

/* ---------- 独立外壳：左侧边栏 + 右侧内容区（对齐运营中心），背景铺满屏幕 ---------- */
.qc-page {
  min-height: 100%;
  height: auto; /* 覆盖 .pm-page 的 height:100%，让外壳随内容撞开，侧边栏 sticky 才有钉住空间 */
  background: #f5f7fb;
  color: #202532;
  display: flex;
  flex-direction: row; /* 覆盖 .pm-page 的 column，左侧边栏 + 右内容区 */
  align-items: stretch;
}

/* 侧边栏：固定可视高度，内容区滚动时保持可见 */
.qc-side {
  width: 220px;
  flex-shrink: 0;
  align-self: flex-start;
  position: sticky;
  top: 0;
  height: calc(100vh - var(--header-height));
  overflow-y: auto;
  background: #fff;
  border-right: 1px solid #e8ebf1;
  padding: 14px 12px;
  transition: width 0.2s, padding 0.2s, border 0.2s;
}
.qc-page .qc-side.collapsed {
  width: 0;
  padding: 0;
  border-right: none;
  overflow: hidden;
}
.qc-side-brand { font-size: 17px; font-weight: 800; color: #202532; padding: 6px 10px 2px; line-height: 1.2; }
.qc-side-brand span { display: block; font-size: 12px; color: #9aa1ae; font-weight: 400; margin-top: 4px; }
.qc-page .qc-grp { font-size: 12px; color: #9aa1ae; padding: 14px 12px 8px; }
.qc-page .qc-nav {
  padding: 12px 12px;
  border-radius: 10px;
  margin: 4px 0;
  color: #4f5665;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 46px;
  font-size: 15px;
}
.qc-page .qc-nav:hover { background: #f5f8ff; }
.qc-page .qc-nav.active { background: #eef3ff; color: #4f7cff; font-weight: 700; }
.qc-page .qc-nav-ico { width: 18px; flex: 0 0 18px; text-align: center; }
.qc-page .qc-nav-text { flex: 1; min-width: 0; }
/* 品控-线上壳：侧栏菜单无图标 · 文本居中（还原线上版形态） */
.qc-page .qc-side.qcon-side .qc-nav { justify-content: center; }
.qc-page .qc-side.qcon-side .qc-nav-text { flex: 0 0 auto; }
.qc-page .qc-badge {
  min-width: 20px;
  padding: 0 6px;
  height: 20px;
  line-height: 20px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 500;
  text-align: center;
  background: #ffece8;
  color: #f53f3f;
}
.qc-page .qc-badge.orange { background: #fff7e8; color: #ff7d00; }

/* 右侧内容区：整列自然滚动 */
.qc-main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  padding: 20px 24px;
}

.qc-page .qc-head { padding: 0 0 14px; }
.qc-page .qc-title { font-size: 26px; font-weight: 800; color: #202532; display: flex; align-items: baseline; }
.qc-page .qc-title .qc-desc { font-size: var(--fs-base); color: #8b92a1; font-weight: 400; margin-left: 12px; }

.qc-page .qc-filters { display: flex; align-items: center; gap: 14px; margin: 12px 0; flex-wrap: wrap; }
.qc-page .qc-body .qc-filters { margin: 0 0 12px; }
.qc-page .qc-filters .input-icon { flex: none; }
.qc-page .qc-junk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; font-size: var(--fs-base); color: #5b6475; }
.qc-page .qc-count { margin-left: auto; font-size: 12px; color: #8b92a1; }

/* 筛选输入：对齐运营中心输入件 */
.qc-page .input,
.qc-page .select {
  height: 40px;
  border: 1px solid #e5e9f0;
  border-radius: 10px;
  background-color: #fbfcfe;
  color: #445066;
}

/* 按钮：对齐运营中心圆角按钮 */
.qc-page .btn { height: 38px; border-radius: 10px; padding: 0 16px; }
.qc-page .btn.sm { height: 28px; padding: 0 10px; }

/* ---------- 概览卡片 ---------- */
.qc-page .qc-stats {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 14px;
  padding: 0 0 16px;
}
.qc-page .qc-stat {
  background: #fff;
  border: 1px solid #e8ebf1;
  border-radius: 16px;
  box-shadow: 0 8px 28px rgba(26, 34, 56, 0.05);
  padding: 18px;
}
.qc-page .qc-stat .k { font-size: 12px; color: #7e8796; }
.qc-page .qc-stat .v { font-size: 25px; font-weight: 800; margin-top: 6px; line-height: 1.2; }
.qc-page .qc-stat .s { font-size: 12px; color: #8b92a1; margin-top: 4px; }
.qc-page .qc-stat .v.danger { color: var(--danger); }
.qc-page .qc-stat .v.ok { color: var(--success); }
.qc-page .qc-stat .v.warn { color: var(--warning); }
.qc-page .qc-stat .v.bad { color: var(--danger); }

@media (max-width: 1500px) {
  .qc-page .qc-stats { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 1000px) {
  .qc-page .qc-stats { grid-template-columns: repeat(2, 1fr); }
}

/* ---------- 维度切换 tab（已废弃，导航移至侧边栏） ---------- */

/* ---------- 工作区：白色圆角卡片，随内容区自然滚动，内容不足时拉伸至屏幕底部 ---------- */
.qc-page .qc-body {
  flex: 1 0 auto;
  overflow-x: auto;
  overflow-y: visible;
  padding: 16px 18px;
  background: #fff;
  border: 1px solid #e8ebf1;
  border-radius: 16px;
  box-shadow: 0 8px 28px rgba(26, 34, 56, 0.05);
}
.qc-page .qc-body .table { min-width: 1080px; }
.qc-page .qc-body .table.qc-wide { min-width: 1180px; }
.qc-page .qc-body .table.qc-wider { min-width: 1400px; }

.qc-page .table thead th {
  background: #fbfcfe;
  border-bottom: 1px solid #edf0f5;
  color: #5d6678;
  font-weight: 500;
  font-size: var(--fs-base);
}
.qc-page .table tbody td {
  border-bottom: 1px solid #f0f3f7;
  color: #445066;
  font-size: var(--fs-base);
}
.qc-page .table tbody tr:hover { background: #fcfdff; }

.qc-page .table .arrow {
  color: var(--text-3);
  transition: transform 0.15s;
  align-items: center;
}
.qc-page .table .arrow.open { transform: rotate(90deg); }

/* 退款率 / 风险数 着色 */
.qc-page .rate { font-weight: 600; }
.qc-page .rate.ok { color: var(--success); }
.qc-page .rate.warn { color: var(--warning); }
.qc-page .rate.bad { color: var(--danger); }

/* 标签：文字不换行，避免「垃圾品」等被折成两行 */
.qc-page .tag { white-space: nowrap; }

/* 审核状态标签：待审核中性灰 */
.qc-page .tag.rv { background: var(--fill-1); color: var(--text-3); }
.qc-page .tag.rv.green { background: var(--success-light); color: var(--success); }
.qc-page .tag.rv.red { background: #ffece8; color: var(--danger); }
.qc-page .tag.rv.blue { background: var(--primary-light); color: var(--primary); }

/* 操作栏：竖排（td 保持 table-cell，仅子元素 block） */
.qc-page .qc-op-col { white-space: nowrap; }
.qc-page .qc-op-col > * { display: block; color: var(--color-primary); font-size: 12px; line-height: 1.9; text-decoration: none; cursor: pointer; }
.qc-page .qc-op-col a:hover { text-decoration: underline; }

/* ---------- 平台覆盖 ---------- */
.qc-page .plat-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.qc-page .plat-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid #e8ebf1;
  border-radius: 8px;
  padding: 2px 7px;
  font-size: 12px;
  color: #5b6475;
  background: #fbfcfe;
  white-space: nowrap;
}
.qc-page .plat-chip.off { color: var(--text-4); background: transparent; }
.qc-page .platform-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
/* 平台官方图标（替代彩色圆点；off = 未覆盖/无数据置灰） */
.qc-page .plat-logo { width: 16px; height: 16px; border-radius: 4px; object-fit: cover; flex-shrink: 0; }
.qc-page .plat-logo.off { filter: grayscale(1); opacity: 0.45; }

/* ---------- 展开行 ---------- */
.qc-page .expand-row > td { background: var(--fill-1); padding: 12px 16px; }
.qc-page .expand-title { font-size: 12px; color: var(--text-3); margin-bottom: 8px; }
.qc-page .expand-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 1300px) {
  .qc-page .expand-grid { grid-template-columns: 1fr; }
}
.qc-page .sub-codes { display: flex; flex-wrap: wrap; gap: 6px; }

/* 系列展开：下属商品编码明细 */
.qc-page .qc-subtable {
  width: 100%;
  border-collapse: collapse;
  background: var(--white);
  border: 1px solid #e8ebf1;
  border-radius: 10px;
  overflow: hidden;
  font-size: 12px;
}
.qc-page .qc-subtable th,
.qc-page .qc-subtable td {
  padding: 8px 10px;
  text-align: left;
  border-bottom: 1px solid #f0f3f7;
  vertical-align: top;
}
.qc-page .qc-subtable th { background: #fbfcfe; color: var(--text-2); font-weight: 500; }
.qc-page .qc-subtable tr:last-child td { border-bottom: none; }

/* 平台数据矩阵（子表） */
.qc-page .matrix { width: 100%; border-collapse: collapse; background: var(--white); border: 1px solid #e8ebf1; border-radius: 10px; overflow: hidden; }
.qc-page .matrix th,
.qc-page .matrix td { padding: 8px 10px; font-size: 12px; text-align: left; border-bottom: 1px solid #f0f3f7; }
.qc-page .matrix th { background: #fbfcfe; color: #5d6678; font-weight: 700; white-space: nowrap; }
.qc-page .matrix tr.off td { color: var(--text-4); }
.qc-page .matrix tr:last-child td { border-bottom: none; }

/* ---------- 售后类型命中条 ---------- */
.qc-page .type-bars { display: flex; flex-direction: column; gap: 8px; }
.qc-page .tb-row { display: flex; align-items: center; gap: 10px; font-size: 12px; margin-bottom: 6px; }
.qc-page .tb-row .tag { flex: none; width: 112px; justify-content: center; }
.qc-page .tb-bar { flex: 1; height: 6px; background: var(--fill-2); border-radius: 3px; overflow: hidden; }
.qc-page .tb-bar i { display: block; height: 100%; border-radius: 3px; background: var(--primary); }
.qc-page .tb-cnt { width: 56px; text-align: right; color: var(--text-2); flex-shrink: 0; }
.qc-page .tb-pct { width: 96px; text-align: right; color: var(--text-3); flex-shrink: 0; }

/* ---------- 概览扩展面板 ---------- */
.qc-page .qc-ov { display: flex; flex-direction: column; gap: 16px; }
.qc-page .qc-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.qc-page .qc-panels.ov-trend { grid-template-columns: 2fr 1fr; }
@media (max-width: 1300px) {
  .qc-page .qc-panels, .qc-page .qc-panels.ov-trend { grid-template-columns: 1fr; }
}
.qc-page .qc-panel {
  border: 1px solid #e8ebf1;
  border-radius: 12px;
  padding: 14px 16px;
  background: #fff;
}
.qc-page .p-title { font-size: 14px; font-weight: 700; color: #202532; margin-bottom: 12px; }
.qc-page .p-sub { font-size: 12px; color: #8b92a1; font-weight: 400; margin-left: 6px; }

/* 审核状态四宫格 */
.qc-page .rv-dist { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.qc-page .rv-cell {
  background: var(--fill-1);
  border-radius: 10px;
  padding: 12px;
  text-align: center;
}
.qc-page .rv-cell .n { font-size: 20px; font-weight: 800; color: #5b6475; }
.qc-page .rv-cell .k { font-size: 12px; color: #8b92a1; margin-top: 2px; }
.qc-page .rv-cell.green { background: var(--success-light); }
.qc-page .rv-cell.green .n { color: var(--success); }
.qc-page .rv-cell.red { background: #ffece8; }
.qc-page .rv-cell.red .n { color: var(--danger); }
.qc-page .rv-cell.blue { background: var(--primary-light); }
.qc-page .rv-cell.blue .n { color: var(--primary); }

/* ---------- 问题类型趋势图例 ---------- */
.qc-page .type-trend-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; }
.qc-page .ttl-item { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #5b6475; }
.qc-page .ttl-item i { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }

/* ---------- 图表：趋势图 / 环形图 ---------- */
.qc-page .trend-svg { width: 100%; height: auto; display: block; }
.qc-page .trend-svg .ax { font-size: 10px; fill: #8b92a1; }
.qc-page .trend-svg .ax.red { fill: #f53f3f; }
.qc-page .donut-wrap { display: flex; align-items: center; gap: 18px; }
.qc-page .donut { width: 150px; height: 150px; flex-shrink: 0; }
.qc-page .donut-n { font-size: 24px; font-weight: 800; fill: #202532; }
.qc-page .donut-k { font-size: 11px; fill: #8b92a1; }
.qc-page .donut-legend { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.qc-page .dl-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.qc-page .dl-row i { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.qc-page .dl-k { color: #5b6475; flex: 1; min-width: 0; }
.qc-page .dl-v { font-weight: 700; color: #202532; }
.qc-page .dl-p { width: 52px; text-align: right; color: #8b92a1; }

/* ---------- TOP 问题商品 ---------- */
.qc-page .top-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 6px;
  border-bottom: 1px solid #f0f3f7;
  cursor: pointer;
  font-size: var(--fs-base);
}
.qc-page .top-row:last-child { border-bottom: none; }
.qc-page .top-row:hover { background: #fcfdff; }
.qc-page .top-rank {
  width: 20px;
  height: 20px;
  border-radius: 6px;
  background: var(--fill-1);
  color: #5b6475;
  font-size: 12px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.qc-page .top-rank.hot { background: #ffece8; color: #f53f3f; }
.qc-page .top-info { flex: 1; min-width: 0; }
.qc-page .top-info .n { font-weight: 600; color: #202532; }
.qc-page .top-info .m { font-size: 12px; color: #8b92a1; }

/* ---------- 售后类型命中统计卡 ---------- */
.qc-page .as-rank { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
@media (max-width: 1300px) {
  .qc-page .as-rank { grid-template-columns: repeat(3, 1fr); }
}
.qc-page .as-rank-cell {
  background: var(--fill-1);
  border-radius: 10px;
  padding: 12px 14px;
}
.qc-page .as-rank-cell .k { font-size: 12px; color: #5b6475; }
.qc-page .as-rank-cell .n { font-size: 22px; font-weight: 800; margin-top: 4px; color: #202532; }
.qc-page .as-rank-cell .s { font-size: 12px; color: #8b92a1; margin-top: 4px; }

/* ---------- 售后明细分页 ---------- */
.qc-page .as-pager { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 12px; }
.qc-page .as-pager .btn { height: 30px; padding: 0 12px; font-size: 12px; }
.qc-page .as-pager .btn:disabled { opacity: .45; cursor: not-allowed; }
.qc-page .pg-info { font-size: 12px; color: var(--text-3); }

/* ---------- 聊天会话 ---------- */
.qc-page .session-card {
  border: 1px solid #e8ebf1;
  border-radius: 10px;
  margin-bottom: 10px;
  background: var(--white);
  overflow: hidden;
}
.qc-page .s-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  cursor: pointer;
  font-size: 12px;
  flex-wrap: wrap;
}
.qc-page .s-head:hover { background: #fcfdff; }
.qc-page .s-id { font-weight: 600; color: var(--text-2); }
.qc-page .s-time { color: var(--text-3); }
.qc-page .s-msgs { color: var(--text-3); }
.qc-page .s-hits { display: inline-flex; gap: 4px; }
.qc-page .s-orders { color: var(--primary); }
.qc-page .s-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.qc-page .session-bubbles {
  border-top: 1px solid #f0f3f7;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: #fbfcfe;
  max-height: 280px;
  overflow-y: auto;
}
.qc-page .bubble-row { display: flex; gap: 8px; max-width: 80%; }
.qc-page .bubble-row.support { margin-left: auto; flex-direction: row-reverse; }
.qc-page .b-av {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  background: var(--primary-light);
  color: var(--primary);
}
.qc-page .bubble-row.support .b-av { background: var(--primary-light); color: var(--primary); }
/* AI 回复：浅绿气泡 + 绿色 AI 头像，与客服浅蓝区分（权重高于 .support 规则避免被覆盖） */
.qc-page .bubble-row.support.ai .b-av { background: var(--success-light); color: var(--success); font-size: 10px; font-weight: 700; }
.qc-page .bubble-row.support.ai .b-text { background: var(--success-light); border-color: transparent; }
.qc-page .b-main { min-width: 0; }
.qc-page .b-meta { font-size: 11px; color: var(--text-4); margin-bottom: 3px; }
.qc-page .bubble-row.support .b-meta { text-align: right; }
.qc-page .b-text {
  display: inline-block;
  background: #fff;
  border: 1px solid #e8ebf1;
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 12px;
  line-height: 1.7;
  color: var(--text-1);
}
.qc-page .bubble-row.support .b-text { background: var(--primary-light); border-color: transparent; }
.qc-page .drawer-sessions .session-bubbles { background: var(--fill-1); }

/* 会话头部“全屏”按钮 */
.qc-page .s-expand {
  color: var(--primary);
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
}
.qc-page .s-expand:hover { text-decoration: underline; }

/* 全屏聊天模态 */
.chat-modal-mask {
  position: fixed;
  inset: 0;
  background: rgba(29, 33, 41, 0.45);
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;
}
.chat-modal {
  width: 680px;
  max-width: 90vw;
  height: 80vh;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 12px 40px rgba(0,0,0,.15);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.chat-modal-head {
  padding: 16px 20px;
  border-bottom: 1px solid #e8ebf1;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  font-size: var(--fs-base);
}
.chat-modal-head .d-title {
  font-weight: 600;
  font-size: 15px;
  color: var(--text-1);
}
.chat-modal-head .x {
  margin-left: auto;
  cursor: pointer;
  color: var(--text-3);
  display: flex;
}
.chat-modal-head .x:hover { color: var(--text-1); }
.chat-modal-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: #fbfcfe;
}
/* 模态框内会话气泡不限高 */
.chat-modal-body .session-bubbles {
  max-height: none;
  overflow-y: visible;
}

/* 全屏弹窗头部：字段标签化（平台/店铺/会话编号…）让用户感知信息含义 */
.qc-page .chat-modal-head { padding: 12px 16px; font-size: 12px; gap: 8px 14px; }
.qc-page .chat-modal-head .s-meta,
.qc-page .s-head .s-meta { display: inline-flex; align-items: center; gap: 5px; color: var(--text-2); }
.qc-page .chat-modal-head .s-meta > i,
.qc-page .s-head .s-meta > i { font-style: normal; color: var(--text-4); }
.qc-page .chat-modal-head .s-meta > i::after,
.qc-page .s-head .s-meta > i::after { content: '：'; }
.qc-page .chat-modal-head .s-id { font-size: var(--fs-base); }
.qc-page .chat-modal-head .x { margin-left: auto; }
/* 底部操作栏：上一个/下一个会话切换按钮 */
.qc-page .chat-modal-foot {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 10px 16px;
  border-top: 1px solid #e8ebf1;
  background: #fff;
}
.qc-page .cm-nav { display: inline-flex; align-items: center; gap: 8px; }
.qc-page .cm-nav button {
  height: 30px;
  padding: 0 14px;
  border: 1px solid var(--border-2);
  border-radius: 8px;
  background: #fff;
  color: var(--text-2);
  font-size: 12px;
  cursor: pointer;
}
.qc-page .cm-nav button:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
.qc-page .cm-nav button:disabled { opacity: 0.45; cursor: not-allowed; }
.qc-page .cm-idx { min-width: 44px; text-align: center; color: var(--text-3); font-size: 12px; }

/* 命中问题类型编辑条 */
.qc-page .cm-hits {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  padding: 10px 16px;
  border-bottom: 1px solid #e8ebf1;
  background: #fff;
  font-size: 12px;
}
.qc-page .cm-hits-label { color: var(--text-3); }
.qc-page .cm-hits .tag { display: inline-flex; align-items: center; gap: 5px; }
.qc-page .cm-x { font-style: normal; cursor: pointer; opacity: 0.65; }
.qc-page .cm-x:hover { opacity: 1; }
.qc-page .cm-add { position: relative; display: inline-flex; }
.qc-page .cm-add > a { color: var(--primary); cursor: pointer; }
.qc-page .cm-add > a:hover { text-decoration: underline; }
.qc-page .cm-add-pop {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  z-index: 90;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 150px;
  max-height: 240px;
  overflow-y: auto;
  background: #fff;
  border: 1px solid #e8ebf1;
  border-radius: 10px;
  box-shadow: 0 10px 30px rgba(26, 34, 56, 0.12);
  padding: 6px;
}
.qc-page .cm-add-pop a { padding: 6px 10px; border-radius: 7px; font-size: 12px; color: #445066; cursor: pointer; white-space: nowrap; }
.qc-page .cm-add-pop a:hover { background: #f5f8ff; color: var(--primary); }
.qc-page .cm-add-pop .cm-none { padding: 6px 10px; font-size: 12px; color: var(--text-4); }

/* 命中短语高亮 */
.qc-page .b-text mark,
.qc-page mark {
  background: #ffe58f;
  color: #874d00;
  padding: 0 2px;
  border-radius: 3px;
}

/* ---------- 审核弹窗 ---------- */
.qc-page .rv-evid {
  border: 1px solid #e8ebf1;
  border-radius: 10px;
  padding: 10px 12px;
  background: var(--white);
}
.qc-page .rv-decision { display: flex; gap: 10px; }
.qc-page .rv-opt {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--border-2);
  border-radius: 8px;
  padding: 8px 14px;
  font-size: var(--fs-base);
  cursor: pointer;
  color: var(--text-2);
}
.qc-page .rv-opt.on { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
.qc-page .rv-opinion { height: 84px; padding: 8px 10px; resize: vertical; line-height: 1.6; }
.qc-page .rv-last { font-size: 12px; color: var(--text-3); line-height: 1.6; }

/* ---------- 问题类型标签（表格列） ---------- */
.qc-page .prob-tags { display: flex; flex-wrap: wrap; gap: 4px; }
